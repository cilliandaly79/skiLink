/* gentle snowfall over the map */
const snowC = document.getElementById('snow'), sctx = snowC.getContext('2d');
let snowOn = true, flakes = [], snowW = 0, snowH = 0;
// size the canvas to the map (capped), only when the map's size really changes; free it while snow is off
function sizeSnow(){
  const m = document.getElementById('mapWrap'), w = Math.min(m.clientWidth, 2000), h = Math.min(m.clientHeight, 2000);
  if (!snowOn){ if (snowC.width){ snowC.width = 0; snowC.height = 0; snowW = snowH = 0; } return; }
  if (w === snowW && h === snowH) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  snowW = w; snowH = h; snowC.width = Math.round(w * dpr); snowC.height = Math.round(h * dpr); sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  flakes = Array.from({length:Math.round(w * h / 9000)}, () => ({x:Math.random() * w, y:Math.random() * h, r:0.8 + Math.random() * 2.2, s:12 + Math.random() * 28, w:Math.random() * 6.28, o:0.45 + Math.random() * 0.45}));
}
new ResizeObserver(sizeSnow).observe(document.getElementById('mapWrap'));
function drawSnow(dt){
  if (!snowOn || !snowW) return;
  const W = snowW, H = snowH;
  sctx.clearRect(0, 0, W, H);
  for (const f of flakes){
    f.y += f.s * dt; f.w += dt * 0.8; f.x += Math.sin(f.w) * 0.35;
    if (f.y > H + 4){ f.y = -4; f.x = Math.random() * W; }
    sctx.beginPath(); sctx.arc(f.x, f.y, f.r, 0, 6.283);
    sctx.fillStyle = `rgba(255,255,255,${f.o})`; sctx.fill();
    sctx.lineWidth = 0.7; sctx.strokeStyle = `rgba(95,140,190,${f.o * 0.45})`; sctx.stroke();
  }
}
document.getElementById('bSnow').onclick = e => { snowOn = !snowOn; e.currentTarget.classList.toggle('on', snowOn); sizeSnow(); };
document.getElementById('bPlace').onclick = e => {
  ui.placing = !ui.placing; e.currentTarget.classList.toggle('on', ui.placing);
  if (ui.placing) toast('Tap the map where you are');
};
document.getElementById('bGps').onclick = () => {
  if (!navigator.geolocation || !G) return toast('Location not available');
  navigator.geolocation.getCurrentPosition(p => {
    const {id, meters} = nearestMainNode(p.coords.latitude, p.coords.longitude);
    if (meters > 1500) toast(`You're ${(meters/1000).toFixed(0)} km from this resort — keeping the demo position`);
    else { moveYouTo(id, `Snapped to your GPS: ${nodeLabel(id)}`); map.flyTo([p.coords.latitude, p.coords.longitude], 16); }
  }, () => toast('Could not get your location'), {enableHighAccuracy:true, timeout:10000});
};

/* =========================================================================
   PHONE LAYOUT — full-screen map with a draggable bottom sheet
   ========================================================================= */
const mq = matchMedia('(max-width: 899px)');
const panel = document.getElementById('panel'), hero = document.getElementById('hero'), mapWrap = document.getElementById('mapWrap');
const quick = document.getElementById('quick'), banner = document.getElementById('navBanner');
ui.sheet = 'peek';
const isMobile = () => document.body.classList.contains('mobile');
const peekH = () => ['grab', 'quick', 'tabs'].reduce((a, id) => a + document.getElementById(id).offsetHeight, 0) + 12;
function sheetY(state){
  const H = panel.offsetHeight;
  if (state === 'full') return 0;
  if (state === 'half') return Math.max(0, H - innerHeight * 0.56);
  return Math.max(0, H - peekH());
}
function setSheet(state){
  ui.sheet = state;
  if (!isMobile()) return;
  panel.style.setProperty('--sheet-y', sheetY(state) + 'px');
  document.body.style.setProperty('--peek', peekH() + 'px');
}
let layoutInit = false;
function applyLayout(){
  const m = mq.matches;
  document.body.classList.toggle('mobile', m);
  if (m && hero.parentNode !== mapWrap) mapWrap.appendChild(hero);
  if (!m && hero.parentNode !== panel) panel.insertBefore(hero, document.getElementById('tabs'));
  if (!layoutInit && m){ snowOn = false; document.getElementById('bSnow').classList.remove('on'); sizeSnow(); }   // save battery on phones
  layoutInit = true;
  map.invalidateSize({pan:false});
  setSheet(ui.sheet);
}
mq.addEventListener('change', applyLayout);
addEventListener('resize', () => setSheet(ui.sheet));
new ResizeObserver(() => map.invalidateSize({pan:false})).observe(document.getElementById('map'));
applyLayout();

// map padding that keeps routes clear of the floating header and the sheet
function mapPad(){
  if (!isMobile()) return {padding:[70, 70]};
  const top = (document.body.classList.contains('navon') ? banner.offsetHeight : hero.offsetHeight) + 30;
  return {paddingTopLeft:[24, top], paddingBottomRight:[76, panel.offsetHeight - sheetY(ui.sheet) + 24]};
}

// drag the sheet by its handle or tab bar; tap the handle to cycle sizes
let drag = null, swallowClick = false;
['grab', 'tabs'].forEach(id => document.getElementById(id).addEventListener('pointerdown', e => {
  if (!isMobile()) return;
  drag = {y0:e.clientY, base:sheetY(ui.sheet), moved:false, el:e.currentTarget, id:e.pointerId};
}));
addEventListener('pointermove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) < 8) return;
  if (!drag.moved){ drag.moved = true; panel.classList.add('dragging'); try { drag.el.setPointerCapture(drag.id); } catch {} }
  panel.style.setProperty('--sheet-y', Math.max(0, Math.min(sheetY('peek'), drag.base + dy)) + 'px');
});
addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved){
    panel.classList.remove('dragging');
    const dy = e.clientY - d.y0, order = ['full', 'half', 'peek'];
    let i = order.indexOf(ui.sheet);
    if (Math.abs(dy) > 50) i = Math.max(0, Math.min(2, i + (dy < 0 ? -1 : 1) * (Math.abs(dy) > 320 ? 2 : 1)));
    setSheet(order[i]);
    swallowClick = true; setTimeout(() => swallowClick = false, 50);
  } else if (d.el.id === 'grab') setSheet(ui.sheet === 'peek' ? 'half' : ui.sheet === 'half' ? 'full' : 'peek');
});

// Progress outside the app while meeting a friend: an ongoing notification (lock screen /
// notification shade) plus a minutes-left badge on the home-screen icon. The screen is allowed
// to sleep as normal to save battery.
const NOTE_TAG = 'pistemap-nav';
let lastNote = '';
async function swReg(){ try { return 'serviceWorker' in navigator ? await navigator.serviceWorker.ready : null; } catch { return null; } }
function askNotify(){
  if (!('Notification' in window)) return Promise.resolve(false);
  if (Notification.permission === 'default') return Notification.requestPermission().then(p => p === 'granted').catch(() => false);
  return Promise.resolve(Notification.permission === 'granted');
}
async function showProgress(title, body){
  const key = title + '|' + body; if (key === lastNote) return; lastNote = key;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const reg = await swReg(); if (!reg || !ui.nav) return;
  reg.showNotification(title, {tag:NOTE_TAG, body, icon:'icon-192.png', badge:'icon-192.png', silent:true, renotify:false,
    requireInteraction:true, data:{nav:true}, actions:[{action:'open', title:'Open map'}, {action:'end', title:'End'}]}).catch(() => {});
}
async function setBadge(min){ try { if (min == null) await navigator.clearAppBadge?.(); else await navigator.setAppBadge?.(min); } catch {} }
async function endPresence(finalMsg){
  lastNote = ''; setBadge(null); document.title = 'PisteMap';
  const reg = await swReg(); if (!reg) return;
  try { (await reg.getNotifications({tag:NOTE_TAG})).forEach(n => n.close()); } catch {}
  if (finalMsg && 'Notification' in window && Notification.permission === 'granted')
    reg.showNotification('Met up! 🎉', {tag:NOTE_TAG, body:finalMsg.replace(/^🎉\s*/, ''), icon:'icon-192.png'}).catch(() => {});
}
function updatePresence(total, f, stepText){
  const mins = Math.max(1, Math.ceil(total / 60));
  setBadge(total < 1 ? 0 : mins);
  document.title = `${total < 1 ? 'Arrived' : mins + ' min'} to ${f.name} · PisteMap`;
  const friendLine = f.state === 'waiting' ? `${f.name} is waiting for you ✓` : `${f.name} is on the way`;
  showProgress(total < 1 ? `You're at the meeting point` : `⛷ ${mins} min to ${f.name}`, `${stepText}\n${friendLine}`);
}
// the notification's "End" button
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => {

});

// big turn-by-turn banner over the map

  if (!ui.nav) return;
  const f = ui.nav.friend, steps = buildSteps((you.edge ? [you.edge] : []).concat(you.navQueue)), s = steps[0], n = steps[1];
  const verb = st => st.kind === 'lift' ? `Ride ${st.name}` : st.kind === 'walk' ? 'Walk to the next lift' : st.kind === 'link' ? 'Short traverse' : `Ski ${st.name}`;
  const total = remainingOnEdge(you) + you.navQueue.reduce((a, e) => a + e.cost, 0);
  const fT = f.state === 'waiting' && f.node === ui.nav.meet ? 0 : remainingOnEdge(f);
  let ic, title, sub;
  if (!s){ ic = '📍'; title = `Wait here for ${f.name}`; sub = `At the ${nodeLabel(ui.nav.meet)}`; }
  else {
    ic = s.kind === 'lift' ? GLYPH.lift : s.kind === 'walk' ? '🚶' : s.kind === 'link' ? '⛷' : GLYPH.ski;
    title = you.state === 'queue' ? `Queue for ${s.name}` : verb(s);

    sub = s.kind === 'run' ? `${style(s.rank).label} · ${fmtKm(left)} to go` : s.kind === 'lift' ? `${s.typeLabel} · ${fmtKm(left)} to go` : `${fmtKm(left)} on foot`;
  }

    <div class="nb-eta"><b>${total < 1 ? 'Now' : fmtT(total)}</b><small>to ${f.name}</small></div></div>
    <div class="nb-next"><span>${s ? (n ? 'Then: ' + verb(n) : `Then: meet ${f.name}`) : ''}</span>
    <span>${f.state === 'waiting' ? `<span class="ok">✓ ${f.name} is waiting</span>` : `${f.name} there in ${fmtT(fT)}`}</span></div>`;
  updatePresence(total, f, s ? (you.state === 'queue' ? `Queue for ${s.name}` : verb(s)) + (n ? ` → then ${verb(n).replace(/^\w/, c => c.toLowerCase())}` : '') : `Wait here for ${f.name}`);

/* =========================================================================
   LIVE LIFT & RUN STATUS
   Polls /api/status/<resort> (server.py reads the resort's own feed) every 3 minutes,
   matches feed names to the map's lifts and runs, and closes them for routing.
   ========================================================================= */
const STATUS_EVERY = 3 * 60 * 1000;
let statusTimer = null;
const STOP = new Set(['the', 'de', 'des', 'du', 'la', 'le', 'les', 'di', 'del', 'und', 'and', 'am', 'im', 'nr', 'no']);
const LIFT_WORDS = /\b(\d*(eub|ksb|kseb|dsb|sb|sl|tb|seb|gb|pb|lsb|kb|stb|ub|tsd|tsf|tc|tk|tph|tlc|ts|fun)|telecabine|telesiege|teleski|telepherique|funiculaire|chairlift|chair|gondola|express|sesselbahn|gondelbahn|seilbahn|schlepplift|kabinenbahn|lift|piste|skiroute|run|slope|ski|route)\b/g;
const normName = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/ß/g, 'ss').replace(LIFT_WORDS, ' ').replace(/[^a-z0-9]+/g, ' ').trim()
  .split(' ').filter(t => t && !STOP.has(t));
// lift codes ("A1", "C30") and section numerals ("I", "II") often appear on only one side
const isCode = t => /^([a-z]?\d+[a-z]?|i{1,3}|iv|v|vi)$/.test(t);
function nameScore(a, b){
  const raw = nameScoreRaw(a, b);
  const a2 = a.filter(t => !isCode(t)), b2 = b.filter(t => !isCode(t));
  return (a2.length === a.length && b2.length === b.length) ? raw : Math.max(raw, 0.92 * nameScoreRaw(a2, b2));
}
function nameScoreRaw(a, b){
  if (!a.length || !b.length) return 0;
  const A = new Set(a), B = new Set(b); let inter = 0; A.forEach(t => { if (B.has(t)) inter++; });
  let sc = 0.5 * inter / Math.min(A.size, B.size) + 0.5 * inter / Math.max(A.size, B.size);
  const ja = a.join(''), jb = b.join('');
  if (ja === jb) return 1;
  if (ja.length > 4 && jb.length > 4 && (ja.includes(jb) || jb.includes(ja))) sc = Math.max(sc, 0.8);
  return sc;
}
// match each OSM lift/run (by name, or by piste number) to a feed entry
function matchStatus(items, ways, kind){
  const cands = items.map(it => ({it, toks: normName(it.name), num: (it.number || (/^(\d{1,3}[a-z]?)\b/i.exec(it.name) || [])[1] || '').toLowerCase()}));
  let matched = 0;
  ways.filter(w => w.kind === kind).forEach(w => {
    const ref = String(w.tags['piste:ref'] || w.tags.ref || '').toLowerCase();
    const toks = normName(w.name);
    let best = null, bs = 0;
    for (const c of cands){
      let sc = nameScore(toks, c.toks);
      if (ref && c.num && ref === c.num) sc = Math.max(sc, toks.length ? 0.7 + 0.3 * sc : 0.9);
      if (sc > bs){ bs = sc; best = c; }
    }
    w.live = bs >= 0.6 ? best.it.status : null;
    if (w.live) matched++;
  });
  return matched;
}
async function refreshStatus(token, quiet){
  const r = currentResort;
  if (!r || !r.id || !G) return;
  // server.py answers /api/status; on static hosting (GitHub Pages) a scheduled job publishes status/<id>.json
  let s = null;
  for (const url of ['api/status/' + r.id, 'status/' + r.id + '.json']){
    try { const res = await fetch(url, {cache:'no-store'}); if (res.ok){ s = await res.json(); break; } } catch {}
  }
  if (!s){ if (!quiet) toast('Live lift status unavailable (offline?)'); return; }
  if (token !== loadToken) return;
  const prev = G.live;
  G.ways.forEach(w => w.live = null);
  if (!s.available){ G.live = {available:false, reason:s.reason}; }
  else {
    const mL = matchStatus(s.lifts, G.ways, 'lift'), mR = matchStatus(s.runs, G.ways, 'run');
    const lo = s.lifts.filter(x => x.status === 'open').length, ro = s.runs.filter(x => x.status === 'open').length;
    G.live = {available:true, updated:s.updated * 1000, sources:s.sources, lifts:{open:lo, total:s.lifts.length}, runs:{open:ro, total:s.runs.length}, matchedLifts:mL, matchedRuns:mR,
      // with nothing running (e.g. before the season) routing ignores status so the app still works
      enforce: lo > 0};
  }
  G.edges.forEach(e => { const st = e.way && e.way.live; e.shut = st === 'closed' || st === 'scheduled'; });
  // demo friends standing on something that's closed move to open terrain
  if (G.live.enforce){
    const openEdges = G.edges.filter(e => e.main && e.kind !== 'link' && !e.down && !e.shut);
    friends.forEach(f => {
      if (!(f.edge && f.edge.shut) || f.state === 'waiting' || (ui.nav && ui.nav.friend === f) || !openEdges.length) return;
      const ok = openEdges.filter(e => allowed(f, e)), e = pick(ok.length ? ok : openEdges);
      Object.assign(f, {edge:e, node:e.from, d:Math.random() * e.length * 0.5, state: e.kind === 'lift' ? 'riding' : 'skiing', holdAt:null});
    });
  }
  drawNetwork(); drawRoute(); paintConds();
  if (ui.view === 'tabs' && ui.tab === 'trails') renderTrails();
  if (ui.route && !ui.nav && ui.routeFriend){ ui.route = planRoute(ui.routeFriend); ui.routeSig = ''; }
  // a lift on your route just closed → find another way
  if (ui.nav && G.live.enforce){
    const ahead = you.navQueue;
    const hit = ahead.find(e => e.shut);
    if (hit){
      const r2 = dijkstra(you.edge ? you.edge.to : you.node, ui.nav.meet, 5);
      if (r2){ you.navQueue = r2.edges; toast(`⚠ ${edgeName(hit)} just closed — rerouted`); drawRoute(); ui.routeSig = ''; }
      else toast(`⚠ ${edgeName(hit)} just closed — no other open way to ${ui.nav.friend.name}`);
    }
  }
  if (prev && prev.available && G.live.available && prev.lifts.open !== G.live.lifts.open && quiet)
    toast(`Lift update: ${G.live.lifts.open} of ${G.live.lifts.total} lifts open`);
}
function startStatusPolling(token){
  clearInterval(statusTimer);
  refreshStatus(token, false);
  statusTimer = setInterval(() => { if (document.visibilityState === 'visible') refreshStatus(token, true); }, STATUS_EVERY);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && G && G.live && G.live.updated && Date.now() - G.live.updated > STATUS_EVERY) refreshStatus(loadToken, true);
});
const statusPill = st => st === 'open' ? '<span class="stp st-open">Open</span>' : st === 'closed' ? '<span class="stp st-closed">Closed</span>'
  : st === 'scheduled' ? '<span class="stp st-sched">Opening</span>' : '';
const agoText = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m + ' min ago'; };
function liveCard(){
  const L = G && G.live;
  if (!L) return `<div class="card livecard"><span class="dot wait"></span><div><b>Checking live lift status…</b></div></div>`;
  if (!L.available) return `<div class="card livecard"><span class="dot off"></span><div><b>Live status not available</b><div class="status">${L.reason || ''}</div></div></div>`;
  const src = (L.sources || []).map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.type}</a>`).join(', ');
  return `<div class="card livecard"><span class="dot ${L.lifts.open ? 'on' : 'off'}"></span><div>
    <b>${L.lifts.open} of ${L.lifts.total} lifts open · ${L.runs.open} of ${L.runs.total} runs open</b>
    <div class="status">Live from the resort · updated ${agoText(L.updated)} · source: ${src}</div>
    ${L.enforce ? '' : '<div class="status" style="color:#b45309">Nothing is running right now — routes are shown as if everything were open.</div>'}</div></div>`;
}

function baseOf(passId){ return RESORTS.find(r => r.id === ui.passBase && (r.passes || []).includes(passId)) || RESORTS.find(r => (r.passes || []).includes(passId)); }

// themed resort picker

function findNearestResort(){
  const revert = () => { sel.value = currentResort && currentResort.id ? currentResort.id : (currentResort ? 'custom' : ''); };
  if (!navigator.geolocation){ revert(); return toast('Location not available on this device'); }
  toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(p => {
    const {latitude:la, longitude:lo} = p.coords;
    const km = r => { const c = [(r.bbox[0] + r.bbox[2]) / 2, (r.bbox[1] + r.bbox[3]) / 2];
      return Math.hypot(c[0] - la, (c[1] - lo) * Math.cos(la * Math.PI / 180)) * 111; };
    const best = RESORTS.slice().sort((a, b) => km(a) - km(b))[0];
    if (km(best) < 25){ chooseArea(best.id); }
    else {
      // not at a preset resort: look for runs & lifts right around the user instead
      revert();
      toast(`Nearest preset is ${best.name} (${Math.round(km(best))} km). Searching your area instead…`);
      loadResort({id:null, name:'Your area', bbox:[la - 0.03, lo - 0.045, la + 0.03, lo + 0.045].map(v => +v.toFixed(4))});
    }
  }, () => { revert(); toast('Could not get your location — pick a resort from the list'); }, {timeout:10000});
}
document.getElementById('bSearch').onclick = () => document.getElementById('searchArea').onclick();
document.getElementById('searchArea').onclick = () => {
  const b = map.getBounds();
  if (b.getNorth() - b.getSouth() > 0.25 || b.getEast() - b.getWest() > 0.35) return toast('Zoom in to one ski area first');
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(v => +v.toFixed(4));
  loadResort({id:null, name:'This area', bbox});
};

let loadToken = 0;
async function loadResort(resort){
  const token = ++loadToken;
  if (ui.nav) stopNav();
  Object.assign(ui, {view:'tabs', routeFriend:null, route:null, selected:null});
  setLoading(`Loading ${resort.name}…`, 'Runs & lifts from OpenStreetMap');
  try {
    const osm = await loadOSM(resort);
    if (token !== loadToken) return;
    setLoading('Building trail network…');
    const pre = buildGraph(osm, resort.bbox);
    if (!pre){ setLoading(); toast('No ski runs or lifts mapped in this area'); return; }
    SCHEME = (pre.lon0 < -30 && pre.lon0 > -170) ? SCHEMES.na : SCHEMES.eu;
    ui.maxRank = window.PREF_RANK || 5;   // your ski level from your profile
    // elevation is needed only for graph nodes (junctions & ends)
    const ids = new Set();
    pre.ways.forEach(w => w.nodes.forEach((id, i) => { if (pre.split.has(id)) ids.add(id); }));
    // pass areas reuse elevation already fetched for their member resorts
    const pts = [...ids].map(id => ({id, lat: pre.coord.get(id)[0], lon: pre.coord.get(id)[1]}));
    const eleKey = 'pm-ele-' + (resort.id || resort.bbox.join(',')), seeds = (resort.parts || []).map(p => 'pm-ele-' + p);
    const {ele, complete} = await loadElevations(pts, eleKey, seeds);
    if (token !== loadToken) return;
    if (!complete){ toast('Map ready — terrain steepness is still loading in the background'); refineElevation(token, osm, resort, pts, eleKey, seeds); }
    G = finishGraph(pre, ele);
    if (!G.mainNodes.length){ setLoading(); toast('Could not build a connected lift/run network here'); return; }
    const name = resort.id ? resort.name : (pre.areas[0] || resort.name);
    currentResort = resort;
    cacheSet('pm-last', resort.id ? {id:resort.id} : {name, bbox:resort.bbox});
    if (!resort.id){ ui.customName = name; sel.value = 'custom'; }
    G.live = null; startStatusPolling(token);
    placeSkiers(); drawNetwork(); makeMarkers(); renderQuick(); setSheet(ui.sheet); fitResort(); drawLegend(); renderPanel(); updateMarkers();
    setLoading();
    loadWeather(token);
  } catch (err){
    console.error(err);
    setLoading(); toast('Could not load resort data (' + err.message + '). Try again in a moment.');
  }
}

async function loadWeather(token){
  const cond = document.getElementById('conds');
  const lifts = G.edges.filter(e => e.main && e.kind === 'lift' && !e.down), named = new Set(lifts.map(e => e.wayId));
  const top = [...G.nodes.values()].reduce((a, n) => (n.ele ?? -1) > (a.ele ?? -1) ? n : a);
  const I = {
    flake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
    temp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0Z"/></svg>',
    wind:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"/></svg>',
    lift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 5 22 2.5M12 3.8V9M6.5 9h11v5.5h-11z"/></svg>',
    run:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 20 7-12 4 6 2-3 5 9Z"/></svg>',
  };
  const km = Math.round(trailGroups().filter(g => g.kind === 'run').reduce((a, g) => a + g.len, 0) / 1000);
  ui.condIcons = I; ui.condBase = {lifts:named.size, km}; ui.condWx = '';
  paintConds();
  try {
    const key = 'pm-wx-' + top.lat.toFixed(3) + ',' + top.lon.toFixed(3);
    let w = cacheGet(key);
    if (!w || Date.now() - w.at > 10 * 60 * 1000){   // weather cached for 10 minutes
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${top.lat.toFixed(4)}&longitude=${top.lon.toFixed(4)}${top.ele != null ? '&elevation=' + Math.round(top.ele) : ''}&current=temperature_2m,wind_speed_10m&daily=snowfall_sum&past_days=1&forecast_days=1&timezone=auto`;
      let r = await fetch(url);
      if (r.status === 429){ await new Promise(res => setTimeout(res, 61000)); if (token !== loadToken) return; r = await fetch(url); }
      if (!r.ok) return;
      w = await r.json(); w.at = Date.now(); cacheSet(key, w);
    }
    if (token !== loadToken) return;
    const snow = (w.daily.snowfall_sum || []).reduce((a, b) => a + (b || 0), 0);
    ui.condWx = `<span title="Temperature at the highest point">${I.temp}${Math.round(w.current.temperature_2m)}°C top</span><span title="New snow, last 48 h">${I.flake}${snow.toFixed(0)} cm new</span><span>${I.wind}${Math.round(w.current.wind_speed_10m)} km/h</span>`;
    paintConds();
  } catch {}
}

function paintConds(){
  const I = ui.condIcons, b = ui.condBase, L = G && G.live; if (!I || !b) return;
  const lifts = L && L.available ? `<span title="Live from the resort"><i class="livedot ${L.lifts.open ? 'on' : ''}"></i>${L.lifts.open}/${L.lifts.total} lifts open</span>` : `<span>${I.lift}${b.lifts} lifts</span>`;
  document.getElementById('conds').innerHTML = (ui.condWx || '') + lifts + `<span>${I.run}${b.km} km runs</span>`;
}
function drawLegend(){
  const seen = [1, 2, 3, 4, 5].map(style).filter((s, i, a) => a.findIndex(x => x.key === s.key) === i);
  document.getElementById('legend').innerHTML = seen.map(s => `<div><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="${s.color}" stroke-width="3.5" ${s.dash ? 'stroke-dasharray="5 3"' : ''}/></svg>${s.label}</div>`).join('') +
    `<div><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="#20232a" stroke-width="2"/></svg>Lift</div>` +
    `<div><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="#7c3aed" stroke-width="4" stroke-dasharray="5 3"/></svg>Your route</div>`;
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
let last = performance.now();
function frame(now){
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  drawSnow(real);
  let dt = real * ui.sim;
  if (G && G.mainNodes.length){
    while (dt > 0){ const h = Math.min(dt, 0.25); skiers.forEach(s => step(s, h)); dt -= h; }
    updateMarkers();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setInterval(() => {
  if (!G) return;
  if (ui.view === 'route'){
    if (!ui.nav && ui.routeFriend) ui.route = planRoute(ui.routeFriend);
    if (routeSig() !== ui.routeSig){ renderRoute(); drawRoute(); } else updateRoute();
  } else if (ui.tab === 'friends') updateFriends();
  else if (ui.tab === 'leaderboard') updateLeaderboard();
  updateQuick(); updateBanner();
}, 500);

// installable + works offline once visited (needs https or localhost)
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// reopen the resort used last time
(() => {
  const last = cacheGet('pm-last');
  const preset = last && last.id && findArea(last.id);
  if (preset){ sel.value = preset.id; loadResort(preset); }
  else if (last && last.bbox) loadResort({id:null, name:last.name, bbox:last.bbox});
  else { sel.value = RESORTS[0].id; loadResort(RESORTS[0]); }
})();
</script>
<script src="config.js"></script>
<script src="account.js"></script>
</body>
