<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f7fdc">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PisteMap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>PisteMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="account.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#0f2742; --muted:#5f7690; --line:#dce8f3; --card:#ffffff; --ice:#f2f8fd; --ice2:#e2eef8; --frost:#c9def0;
    --accent:#2b7de9; --accent-d:#1a5fc2; --route:#ff6b2c; --glass:rgba(255,255,255,.78);
    --shadow:0 6px 24px rgba(23,64,117,.14); --shadow-s:0 2px 10px rgba(23,64,117,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#eaf3fa;color:var(--ink);font:14px/1.4 "Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  button,select{font:inherit;color:inherit;cursor:pointer}
  #app{display:grid;grid-template-columns:1fr 400px;height:100vh;height:100dvh}
  #mapWrap{position:relative;overflow:hidden}
  #map{position:absolute;inset:0;background:#eef5fb}
  /* wintry tint on the topo map */
  #map.topo .leaflet-tile-pane{filter:saturate(.45) brightness(1.1) contrast(.92) hue-rotate(-8deg)}
  #map.sat .leaflet-tile-pane{filter:saturate(.85) brightness(1.04)}
  #snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:650}   /* explicit size: a canvas otherwise takes its CSS size from its pixel size */
  .frost-edge{position:absolute;inset:0;pointer-events:none;z-index:640;box-shadow:inset 0 0 90px rgba(225,240,252,.9)}

  /* floating map UI: frosted glass */
  .glass{background:var(--glass);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow)}
  .topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap;z-index:1000}
  .topbar>*{pointer-events:auto}
  .pillbtn{border-radius:999px;padding:9px 15px;font-weight:600;display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink)}
  .pillbtn:hover{background:#fff}
  .simctl{margin-left:auto;border-radius:999px;display:flex;align-items:center;padding:4px;gap:2px;font-size:12.5px}
  .simctl span{padding:0 8px;color:var(--muted);font-weight:500}
  .simctl button{border:0;background:none;padding:6px 11px;border-radius:999px;font-weight:700}
  .simctl button.on{background:var(--ink);color:#fff}
  .mapctl{position:absolute;right:14px;bottom:34px;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;z-index:1000}
  .mapctl button{width:44px;height:44px;border:0;background:none;font-size:17px;display:grid;place-items:center;color:var(--ink);border-bottom:1px solid rgba(15,39,66,.07)}
  .mapctl button:last-child{border-bottom:0}
  .mapctl button:hover{background:rgba(255,255,255,.9)}
  .mapctl button.on{background:var(--accent);color:#fff}
  .mapctl svg{width:20px;height:20px}
  .legend{position:absolute;left:14px;bottom:28px;border-radius:16px;padding:9px 12px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:5px 14px;color:var(--muted);z-index:1000;font-weight:500}
  .legend div{display:flex;align-items:center;gap:7px}
  #toast{position:absolute;left:50%;top:76px;transform:translateX(-50%) translateY(-10px);background:rgba(15,39,66,.92);backdrop-filter:blur(8px);color:#fff;padding:11px 18px;border-radius:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:1100}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #loading{position:absolute;inset:0;background:rgba(234,243,250,.6);backdrop-filter:blur(4px);display:none;place-items:center;z-index:1050}
  #loading.show{display:grid}
  .loadcard{border-radius:22px;padding:24px 30px;text-align:center;max-width:320px}
  .flake-spin{font-size:34px;color:var(--accent);display:inline-block;animation:sp 2.4s linear infinite;margin-bottom:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadMsg{font-weight:700;font-size:15px}
  #loadSub{color:var(--muted);font-size:12.5px;margin-top:4px}

  /* friend markers: skier pins */
  .sk{position:relative;width:44px;height:60px}
  .sk .pinb{position:absolute;left:5px;top:16px;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:3px solid var(--c);box-shadow:-2px 3px 8px rgba(15,39,66,.35)}
  .sk .glyph{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg);color:var(--c)}
  .sk .glyph svg{width:21px;height:21px;transition:transform .3s}
  .sk .glyph.flip svg{transform:scaleX(-1)}
  .sk .ring{position:absolute;inset:-8px;border-radius:50% 50% 50% 0;border:2.5px dashed var(--c);opacity:0;transition:opacity .2s}
  .sk.sel .ring{opacity:1;animation:sp 8s linear infinite}
  .sk .tag{position:absolute;left:50%;top:-6px;transform:translateX(-50%);background:var(--c);color:#fff;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 8px rgba(15,39,66,.3);border:1.5px solid rgba(255,255,255,.85);line-height:1.35}
  .sk .tag .spd{font-weight:600;opacity:.92;margin-left:4px}
  #map.far .sk .tag{display:none}
  #map.far .sk.sel .tag{display:block}
  .me{position:relative;width:24px;height:24px}
  .me .dot{position:absolute;inset:0;background:var(--accent);border:4px solid #fff;border-radius:50%;box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .me .halo{position:absolute;inset:-20px;background:var(--accent);border-radius:50%;animation:pulse 2.2s ease-out infinite}
  .me .you{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;background:var(--accent);padding:1px 8px;border-radius:999px;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  @keyframes pulse{0%{transform:scale(.3);opacity:.5}100%{transform:scale(1);opacity:0}}
  .pin{width:30px;height:40px}
  .lbl{white-space:nowrap;font-size:11.5px;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;transform:translate(-50%,-50%);display:inline-block;pointer-events:none}
  .lbl.lift{font-style:italic;color:#3d2a4f;font-weight:600}
  .route-line{stroke-dasharray:12 8;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-20}}
  .hl-line{animation:hl .8s ease-in-out infinite alternate}
  @keyframes hl{from{opacity:.3}to{opacity:.95}}
  .leaflet-tooltip{font:13px/1.35 "Outfit",system-ui,sans-serif;border-radius:10px;padding:6px 10px;border:0;box-shadow:var(--shadow)}
  .leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important;border-radius:8px 0 0 0}

  /* panel */
  #panel{background:linear-gradient(180deg,#f8fcff 0%,#eef6fc 100%);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:2}
  .hero{position:relative;padding:18px 18px 46px;color:#fff;overflow:hidden;flex:none;
    background:
      radial-gradient(circle at 12% 22%,rgba(255,255,255,.55) 1.6px,transparent 2.4px),
      radial-gradient(circle at 78% 18%,rgba(255,255,255,.5) 1.4px,transparent 2.2px),
      radial-gradient(circle at 44% 40%,rgba(255,255,255,.4) 1.2px,transparent 2px),
      radial-gradient(circle at 90% 52%,rgba(255,255,255,.45) 1.8px,transparent 2.6px),
      radial-gradient(circle at 28% 62%,rgba(255,255,255,.35) 1.2px,transparent 2px),
      linear-gradient(155deg,#1d4f9c 0%,#2f7fdc 45%,#69bdf5 85%,#a6dcfb 100%)}
  .hero .mtn{position:absolute;left:0;bottom:-1px;width:100%;height:64px}
  .brandrow{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;font-size:13px;opacity:.95}
  .brandrow .logo{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);display:grid;place-items:center}
  .brandrow .live{margin-left:auto;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:6px}
  .brandrow .live i{width:7px;height:7px;border-radius:50%;background:#7dffb0;box-shadow:0 0 0 3px rgba(125,255,176,.25)}
  .selwrap{position:relative;margin:10px 0 10px;display:inline-block;max-width:100%}
  .resort-btn{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:#fff;font-size:26px;font-weight:800;letter-spacing:-.3px;text-align:left;text-shadow:0 2px 12px rgba(10,40,90,.25);max-width:100%}
  .resort-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .resort-btn .chev{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);position:relative}
  .resort-btn .chev::after{content:"";position:absolute;left:8px;top:6px;width:7px;height:7px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}
  .passline{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px;position:relative;z-index:1}
  .passline:empty{display:none}
  .passchip{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;backdrop-filter:blur(6px)}
  .passchip.on{background:#fff;color:#1a5fc2;border-color:#fff}
  /* resort picker */
  .picker{position:fixed;inset:0;z-index:3000;background:rgba(10,30,60,.45);display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .2s}
  .picker.shown{display:flex}
  .picker.open{opacity:1}
  .pk-sheet{width:min(440px,94vw);max-height:86vh;display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#f8fcff,#eef6fc);box-shadow:0 24px 60px rgba(10,30,60,.35);transform:translateY(16px);transition:transform .25s cubic-bezier(.2,.85,.25,1)}
  .picker.open .pk-sheet{transform:none}
  .pk-head{position:relative;padding:18px 18px 40px;color:#fff;background:
      radial-gradient(circle at 15% 30%,rgba(255,255,255,.5) 1.5px,transparent 2.3px),radial-gradient(circle at 80% 22%,rgba(255,255,255,.45) 1.4px,transparent 2.2px),
      radial-gradient(circle at 55% 55%,rgba(255,255,255,.35) 1.2px,transparent 2px),linear-gradient(155deg,#1d4f9c 0%,#2f7fdc 50%,#69bdf5 100%)}
  .pk-head h3{margin:0;font-size:22px;font-weight:800}
  .pk-head p{margin:2px 0 0;font-size:13px;opacity:.9}
  .pk-close{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font-size:16px}
  .pk-head .mtn{position:absolute;left:0;bottom:-1px;width:100%;height:30px}
  .pk-tools{display:flex;gap:8px;padding:0 14px;margin-top:-22px;position:relative;z-index:1}
  .pk-search{flex:1;min-width:0;border:1px solid #fff;background:rgba(255,255,255,.95);border-radius:14px;padding:11px 14px;font:inherit;font-size:15px;box-shadow:var(--shadow);outline:none;color:var(--ink)}
  .pk-search:focus{border-color:var(--accent)}
  .pk-near{flex:none;border:0;border-radius:14px;padding:0 14px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),#4aa3f0);box-shadow:0 4px 12px rgba(43,125,233,.35)}
  .pk-list{overflow:auto;padding:6px 14px 18px}
  .pk-card{background:#fff;border:1.5px solid #e3eef7;border-radius:18px;margin-bottom:8px;box-shadow:var(--shadow-s);overflow:hidden}
  .pk-card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,125,233,.14),var(--shadow-s)}
  .pk-top{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
  .pk-flag{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#1a5fc2;background:linear-gradient(135deg,#e2eefb,#f4f9ff);border:1px solid #d6e6f7}
  .pk-top b{display:block;font-size:16px}
  .pk-top small{color:var(--muted);font-size:12.5px}
  .pk-check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--frost);flex:none}
  .pk-card.on .pk-check{border:6px solid var(--accent)}
  .pk-passes{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px 64px;margin-top:-4px}
  .pk-pass{border:1.5px solid var(--line);background:var(--ice);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink)}
  .pk-pass.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .pk-pass small{display:block;font-weight:500;font-size:11px;opacity:.75}
  .pk-empty{color:var(--muted);text-align:center;padding:24px 0}
  .mobile .picker{align-items:flex-end}
  .mobile .pk-sheet{width:100%;max-height:92vh;border-radius:26px 26px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .mobile .picker .pk-sheet{transform:translateY(40px)}
  .mobile .picker.open .pk-sheet{transform:none}
  .conds{display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
  .conds span{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .conds svg{width:14px;height:14px}
  .tabs{display:flex;margin:-22px 14px 4px;padding:5px;gap:4px;background:rgba(255,255,255,.85);border:1px solid #fff;border-radius:16px;box-shadow:var(--shadow);position:relative;z-index:2;backdrop-filter:blur(10px)}
  .tabs button{flex:1;border:0;background:none;padding:9px 4px;font-weight:600;color:var(--muted);border-radius:11px}
  .tabs button.on{color:#fff;background:linear-gradient(135deg,var(--accent),#4aa3f0);box-shadow:0 3px 10px rgba(43,125,233,.35)}
  .content{flex:1;overflow:auto;padding:12px 14px 18px;min-height:0}
  .section-title{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px;display:flex;align-items:center;gap:6px}
  .section-title:first-child{margin-top:6px}
  .card{background:var(--card);border:1px solid #e6f0f8;border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow-s)}
  .friend{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;transition:.15s}
  .friend.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,125,233,.15),var(--shadow-s)}
  .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;border:3px solid #fff;box-shadow:0 2px 8px rgba(15,39,66,.18);position:relative}
  .avatar svg{width:22px;height:22px}
  .avatar.sm{width:32px;height:32px}
  .avatar.sm svg{width:17px;height:17px}
  .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
  .lvl{font-size:10.5px;font-weight:600;color:var(--accent-d);background:var(--ice2);border-radius:999px;padding:1px 8px}
  .status{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .speed{text-align:right;line-height:1}
  .speed b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .speed small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px;font-weight:500}
  .actions{grid-column:1/-1;display:flex;gap:8px;margin-top:8px}
  .btn{border:1px solid var(--line);background:var(--ice);border-radius:12px;padding:9px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:.15s}
  .btn:hover{background:#fff}
  .btn.route{background:linear-gradient(135deg,#ff8a4c,#ff5a1f);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(255,90,31,.28)}
  .btn.route:hover{filter:brightness(1.05)}
  .btn.grow{flex:1}
  .hint{color:var(--muted);font-size:12.5px;padding:10px 12px;margin:0 0 6px;background:rgba(255,255,255,.6);border:1px dashed var(--frost);border-radius:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .lb-row{display:grid;grid-template-columns:28px auto 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid #edf3f9}
  .lb-row:last-child{border-bottom:0}
  .lb-row.me{background:linear-gradient(90deg,#e8f2fe,#f4f9ff);border-radius:12px}
  .rank{font-weight:800;color:var(--muted);text-align:center;font-size:15px}
  .bar{height:6px;background:var(--ice2);border-radius:4px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:4px}
  .lb-val{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
  .lb-val small{font-weight:500;color:var(--muted);font-size:11px;margin-left:2px}
  .podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:12px}
  .podium .p{background:#fff;border:1px solid #e6f0f8;border-radius:18px;padding:12px 6px 10px;text-align:center;box-shadow:var(--shadow-s)}
  .podium .p.first{padding-top:16px;background:linear-gradient(180deg,#fffbea,#fff);border-color:#f6e3a1}
  .podium .p .avatar{margin:0 auto 6px}
  .podium .p b{display:block;font-size:17px;font-weight:800}
  .podium .p span{font-size:12px;color:var(--muted)}
  .podium .medal{font-size:18px;display:block;margin-bottom:4px}
  .trail{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid #edf3f9;cursor:pointer;border-radius:10px}
  .trail:last-child{border-bottom:0}
  .trail:hover{background:var(--ice)}
  .trail .t-name{flex:1;font-weight:600}
  .trail .t-meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0}
  .stats .card{margin:0;padding:12px 6px;text-align:center}
  .stats b{display:block;font-size:21px;font-weight:800}
  .stats span{font-size:11.5px;color:var(--muted)}
  .back{border:0;background:none;font-weight:600;color:var(--accent);padding:4px 0;margin:4px 0 8px}
  .route-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .route-head h2{margin:0;font-size:19px;font-weight:800}
  .eta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .eta .card{margin:0;padding:11px 14px}
  .eta .lab{font-size:11.5px;color:var(--muted);font-weight:600}
  .eta .val{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .eta .card:first-child .val{color:var(--accent-d)}
  .meetbox{background:linear-gradient(135deg,#fff4ea,#fffaf5);border:1px solid #ffd9b8;border-radius:14px;padding:10px 13px;margin-bottom:12px;font-size:13px}
  .steps{list-style:none;margin:0 0 12px;padding:4px 12px;background:#fff;border:1px solid #e6f0f8;border-radius:18px;box-shadow:var(--shadow-s)}
  .step{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;position:relative}
  .step:not(:last-child)::after{content:"";position:absolute;left:14px;top:36px;bottom:-8px;width:2px;background:repeating-linear-gradient(180deg,var(--frost) 0 4px,transparent 4px 7px)}
  .step .ic{width:30px;height:30px;border-radius:50%;background:var(--ice);border:1px solid var(--line);display:grid;place-items:center;z-index:1}
  .step .ttl{font-weight:600}
  .step .sub{color:var(--muted);font-size:12px}
  .step .tm{color:var(--muted);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ropts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .ropt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:12px 14px;border:1.5px solid #e3eef7;border-radius:18px;background:#fff;text-align:left;box-shadow:var(--shadow-s);transition:.15s;width:100%}
  .ropt:hover{border-color:#cdb8f7}
  .ropt.on{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.14),var(--shadow-s);background:linear-gradient(135deg,#faf7ff,#fff)}
  .ropt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--frost);grid-row:span 3;align-self:start;margin-top:2px;transition:.15s}
  .ropt.on .radio{border:5.5px solid #7c3aed}
  .ropt .nm{font-weight:700;font-size:15px;display:block}
  .ropt .hard{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  .ropt .tmw{text-align:right;line-height:1.1}
  .ropt .tm{font-weight:800;font-size:19px;display:block;font-variant-numeric:tabular-nums}
  .ropt .tmw small{font-size:11.5px;color:var(--muted);font-weight:600}
  .ropt .tmw small.best{color:#7c3aed}
  .ropt .mix{grid-column:2/-1;height:7px;border-radius:5px;overflow:hidden;display:flex;background:var(--ice2);gap:1.5px}
  .ropt .mix i{height:100%}
  .ropt .meta{grid-column:2/-1;font-size:12px;color:var(--muted)}
  .stp{font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:6px;white-space:nowrap}
  .st-open{color:#15803d;background:#dcfce7}
  .st-closed{color:#9f1239;background:#ffe4e6}
  .st-sched{color:#92400e;background:#fef3c7}
  .livecard{display:flex;gap:12px;align-items:flex-start}
  .livecard b{font-size:14px}
  .livecard a{color:var(--accent)}
  .livecard .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none;background:#cbd5e1}
  .livecard .dot.on{background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.2);animation:livep 2s infinite}
  .livecard .dot.wait{background:#f59e0b}
  @keyframes livep{50%{box-shadow:0 0 0 7px rgba(34,197,94,.05)}}
  .livedot{width:8px;height:8px;border-radius:50%;background:#fca5a5;display:inline-block}
  .livedot.on{background:#7dffb0;box-shadow:0 0 0 3px rgba(125,255,176,.3)}
  .err{background:#fff0f0;border:1px solid #ffd0d0;color:#9b1c1c;border-radius:14px;padding:12px;font-size:13px}
  .src{color:var(--muted);font-size:11.5px;padding:8px 4px}

  /* ---------- turn-by-turn banner (all sizes) ---------- */
  #navBanner{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:1002;display:none;width:min(440px,calc(100% - 24px));
    border-radius:22px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#4c1d95,#7c3aed 70%,#8b5cf6);box-shadow:0 10px 30px rgba(76,29,149,.4)}
  .navon #navBanner{display:block}
  .nb-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .nb-ic{width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px}
  .nb-ic svg{width:32px;height:32px;color:#fff}
  .nb-main b{font-size:21px;font-weight:800;display:block;line-height:1.15}
  .nb-main span{font-size:13.5px;opacity:.88}
  .nb-eta{text-align:right;line-height:1.1}

  .nb-next .ok{color:#86efac;font-weight:700}

  /* ---------- phone layout: full-screen map + bottom sheet ---------- */
  .grab,.quick{display:none}
  body.mobile{overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .mobile #app{display:block;position:fixed;inset:0}

  .mobile #panel{position:absolute;left:0;right:0;bottom:0;height:calc(100% - 84px - env(safe-area-inset-top));border:0;border-radius:26px 26px 0 0;
    box-shadow:0 -10px 34px rgba(23,64,117,.22);transform:translateY(var(--sheet-y,60%));transition:transform .3s cubic-bezier(.2,.85,.25,1);z-index:1200;background:#f8fcff}
  .mobile #panel.dragging{transition:none}
  .mobile .grab{display:flex;justify-content:center;padding:10px 0 4px;touch-action:none;cursor:grab}
  .grab i{width:46px;height:5px;border-radius:3px;background:#c3d3e4}
  .mobile .quick{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none;flex:none}
  .quick::-webkit-scrollbar{display:none}
  .qf{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0;border-radius:16px}
  .qf:active{background:var(--ice2)}
  .qf .avatar{width:52px;height:52px;border-width:3px}
  .qf .avatar svg{width:26px;height:26px}
  .qf b{font-size:13px;font-weight:700;line-height:1.1}
  .qf small{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .qf.sel .avatar{box-shadow:0 0 0 3px var(--accent)}
  .mobile .tabs{margin:2px 12px 6px;touch-action:none}
  .mobile .tabs button{padding:12px 4px;font-size:15px}
  .mobile .content{padding:8px 14px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  /* resort header floats over the map */
  .mobile .hero{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;z-index:1001;border-radius:22px;padding:10px 14px 11px;box-shadow:0 8px 26px rgba(23,64,117,.3)}
  .mobile .hero .mtn,.mobile .hero .brandrow{display:none}
  .mobile .selwrap{margin:0 0 7px}
  .mobile .resort-btn{font-size:21px}
  .mobile .resort-btn .chev{width:24px;height:24px}

  .mobile .conds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-14px;padding-right:14px}
  .mobile .conds::-webkit-scrollbar{display:none}
  .mobile .conds span{flex:none;font-size:13px}
  .mobile.navon .hero{display:none}

  .mobile .topbar,.mobile .legend,.mobile #bSnow,.mobile #bMe{display:none}
  .mobile .mapctl{right:10px;bottom:calc(var(--peek,180px) + 14px);border-radius:18px;transition:bottom .3s}
  .mobile .mapctl button{width:52px;height:52px;font-size:19px}

  /* bigger, glove-friendly targets inside the sheet */

  .mobile .status{font-size:13.5px}

  @media (prefers-reduced-motion:reduce){#snow{display:none}.route-line,.me .halo,.sk.sel .ring{animation:none}}
</style>
</head>
<body>
<script>if (matchMedia('(max-width: 899px)').matches) document.body.classList.add('mobile');</script>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
const RESORTS = [   // keep in sync with tools/fetch_resorts.py
  {id:'zermatt',    name:'Zermatt',               country:'CH', region:'Alps', bbox:[45.920,7.660,46.030,7.800], passes:['matterhorn']},
  {id:'stanton',    name:'St. Anton am Arlberg',  country:'AT', region:'Alps', bbox:[47.100,10.150,47.170,10.300], passes:['arlberg']},
  {id:'valthorens', name:'Val Thorens',           country:'FR', region:'Alps', bbox:[45.260,6.530,45.330,6.620], passes:['3vallees']},
  {id:'verbier',    name:'Verbier',               country:'CH', region:'Alps', bbox:[46.060,7.180,46.130,7.330], passes:['4vallees']},
  {id:'ischgl',     name:'Ischgl · Samnaun',      country:'AT', region:'Alps', bbox:[46.930,10.250,47.020,10.380]},
  {id:'solden',     name:'Sölden',                country:'AT', region:'Alps', bbox:[46.900,10.880,46.990,11.030]},
  {id:'kitzbuehel', name:'Kitzbühel',             country:'AT', region:'Alps', bbox:[47.380,12.300,47.460,12.420], passes:['kitzski']},
  {id:'courchevel', name:'Courchevel & Méribel',  country:'FR', region:'Alps', bbox:[45.360,6.540,45.440,6.670], passes:['3vallees']},
  {id:'jackson',    name:'Jackson Hole',          country:'US', region:'Rest of the world', bbox:[43.565,-110.885,43.615,-110.800]},
  {id:'whistler',   name:'Whistler Blackcomb',    country:'CA', region:'Rest of the world', bbox:[50.030,-123.000,50.130,-122.850]},
  {id:'vail',       name:'Vail',                  country:'US', region:'Rest of the world', bbox:[39.570,-106.450,39.650,-106.300]},
  {id:'niseko',     name:'Niseko United',         country:'JP', region:'Rest of the world', bbox:[42.820,140.620,42.890,140.720]},
];
// extra data pieces (data/<id>.json) that join resorts into their lift-pass areas
const PARTS = {
  '3v-belleville':[45.330,6.480,45.365,6.680], 'arlberg-lech':[47.165,10.050,47.270,10.250],
  '4v-nendaz':[46.120,7.250,46.210,7.420], 'cervinia':[45.850,7.580,45.950,7.720], 'kitz-south':[47.300,12.300,47.385,12.470],
};
// lift-pass areas: one ticket, several linked resorts — loaded as one connected map
const PASSES = {
  '3vallees':   {id:'3vallees',   name:'Les 3 Vallées',          pass:'3 Vallées pass',   country:'FR', parts:['courchevel', 'valthorens', '3v-belleville'],
                 covers:'Courchevel · Méribel · Val Thorens · Les Menuires · Orelle'},
  'arlberg':    {id:'arlberg',    name:'Ski Arlberg',            pass:'Ski Arlberg pass', country:'AT', parts:['stanton', 'arlberg-lech'],
                 covers:'St. Anton · St. Christoph · Stuben · Lech · Zürs · Warth-Schröcken'},
  '4vallees':   {id:'4vallees',   name:'4 Vallées',              pass:'4 Vallées pass',   country:'CH', parts:['verbier', '4v-nendaz'],
                 covers:'Verbier · La Tzoumaz · Nendaz · Veysonnaz · Thyon'},
  'matterhorn': {id:'matterhorn', name:'Matterhorn Ski Paradise', pass:'International pass', country:'CH', parts:['zermatt', 'cervinia'],
                 covers:'Zermatt · Breuil-Cervinia · Valtournenche'},
  'kitzski':    {id:'kitzski',    name:'KitzSki',                pass:'KitzSki full area', country:'AT', parts:['kitzbuehel', 'kitz-south'],
                 covers:'Kitzbühel · Kirchberg · Jochberg · Pass Thurn'},
};
const partBbox = id => (RESORTS.find(r => r.id === id) || {}).bbox || PARTS[id];
Object.values(PASSES).forEach(p => {   // pass area = union of its pieces
  const bs = p.parts.map(partBbox);
  p.bbox = [Math.min(...bs.map(b => b[0])), Math.min(...bs.map(b => b[1])), Math.max(...bs.map(b => b[2])), Math.max(...bs.map(b => b[3]))];
  p.region = 'Alps'; p.isPass = true;
});
const findArea = id => RESORTS.find(r => r.id === id) || PASSES[id];
const OVERPASS = ['https://overpass-api.de/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];

// speed m/s, typical line in minutes
const LIFT_TYPES = {
  cable_car:{label:'Cable car', speed:8, wait:6}, gondola:{label:'Gondola', speed:5.5, wait:3},
  mixed_lift:{label:'Chair/gondola', speed:5, wait:2.5}, chair_lift:{label:'Chairlift', speed:4, wait:2},
  drag_lift:{label:'Drag lift', speed:3, wait:1}, 't-bar':{label:'T-bar', speed:3, wait:1}, 'j-bar':{label:'J-bar', speed:3, wait:1},
  platter:{label:'Platter', speed:3, wait:1}, rope_tow:{label:'Rope tow', speed:2, wait:0.5}, magic_carpet:{label:'Magic carpet', speed:1, wait:0.5},
  funicular:{label:'Funicular', speed:8, wait:5}, rack_railway:{label:'Mountain railway', speed:5, wait:8},
};
// OSM piste:difficulty -> internal rank
const RANK = {novice:1, easy:2, intermediate:3, advanced:4, expert:5, freeride:5, extreme:5};
// North America vs. Europe/rest-of-world colour conventions
const SCHEMES = {
  na: {1:{key:'green',label:'Easy',color:'#2a9d58'}, 2:{key:'green',label:'Easy',color:'#2a9d58'}, 3:{key:'blue',label:'Intermediate',color:'#1d6fe0'},
       4:{key:'black',label:'Advanced',color:'#1b1f24'}, 5:{key:'double',label:'Expert',color:'#1b1f24',dash:'7 5'},
       levels:[[2,'Easy only'],[3,'Up to blue'],[4,'Up to black'],[5,'Any terrain']]},
  eu: {1:{key:'green',label:'Beginner',color:'#2a9d58'}, 2:{key:'blue',label:'Easy',color:'#1d6fe0'}, 3:{key:'red',label:'Intermediate',color:'#d62828'},
       4:{key:'black',label:'Difficult',color:'#1b1f24'}, 5:{key:'free',label:'Freeride',color:'#e76f00',dash:'7 5'},
       levels:[[2,'Up to blue'],[3,'Up to red'],[4,'Up to black'],[5,'Any terrain']]},
};
let SCHEME = SCHEMES.na;
const style = rank => SCHEME[rank];

/* =========================================================================
   DATA LOADING
   ========================================================================= */
const overpassQuery = b => `[out:json][timeout:120];(way["piste:type"="downhill"](${b});way["aerialway"](${b});way["railway"="funicular"](${b});way["railway"]["rack"](${b}););out body geom;wr["landuse"="winter_sports"]["name"](${b});out tags center;`;
// funiculars and cog railways (e.g. Zermatt's Sunnegga & Gornergrat) work like lifts
function liftType(t){
  if (LIFT_TYPES[t.aerialway]) return t.aerialway;
  if (t.railway === 'funicular') return 'funicular';
  if (t.railway && t.rack && t.rack !== 'no' && !['abandoned', 'disused', 'razed', 'construction', 'platform', 'station'].includes(t.railway)) return 'rack_railway';
  return null;
}
const cacheGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const cacheSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function loadOSM(resort){
  if (resort.parts){
    // pass area: merge its pieces (shared lifts/runs appear once)
    const seen = new Map();
    for (const pid of resort.parts){
      setLoading(`Loading ${resort.name}…`, `Joining ${resort.parts.indexOf(pid) + 1} of ${resort.parts.length} areas`);
      const osm = await loadOSM({id:pid, name:pid, bbox:partBbox(pid)});
      osm.elements.forEach(e => seen.set(e.type + e.id, e));
    }
    return {elements:[...seen.values()]};
  }
  if (resort.id){
    try { const r = await fetch(`data/${resort.id}.json`); if (r.ok) return r.json(); } catch {}
  }
  const key = 'pm-osm-' + resort.bbox.map(v => v.toFixed(3)).join(',');
  const hit = cacheGet(key); if (hit) return hit;
  setLoading('Downloading runs & lifts from OpenStreetMap…', 'Live query — can take up to a minute');
  let lastErr;
  for (const url of OVERPASS){
    try {
      const r = await fetch(url, {method:'POST', body:'data=' + encodeURIComponent(overpassQuery(resort.bbox.join(',')))});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const slim = {elements: j.elements.map(e => ({type:e.type, id:e.id, tags:e.tags || {}, nodes:e.nodes, geometry: e.geometry && e.geometry.map(p => [p.lat, p.lon])}))};
      cacheSet(key, slim);
      return slim;
    } catch (e){ lastErr = e; }
  }
  throw lastErr;
}

async function loadElevations(points, cacheKey, seedKeys = [], quiet = false){
  // Open-Meteo elevation API (Copernicus DEM, ~90 m), max 100 points per request.
  // Never blocks for long: if the free service is busy it returns what it has (complete:false).
  const cached = Object.assign({}, ...seedKeys.map(k => cacheGet(k) || {}), cacheGet(cacheKey) || {});
  const need = points.filter(p => cached[p.id] === undefined);
  for (let i = 0; i < need.length; i += 100){
    if (!quiet) setLoading('Fetching terrain elevation…', `${Math.min(i + 100, need.length)} / ${need.length} points`);
    const batch = need.slice(i, i + 100);
    const url = `https://api.open-meteo.com/v1/elevation?latitude=${batch.map(p => p.lat.toFixed(5)).join(',')}&longitude=${batch.map(p => p.lon.toFixed(5)).join(',')}`;
    let r;
    try { r = await fetch(url); } catch { r = null; }
    if (!r || !r.ok){ cacheSet(cacheKey, cached); return {ele:cached, complete:false}; }
    const j = await r.json();
    batch.forEach((p, k) => cached[p.id] = j.elevation[k]);
    if (i % 1000 === 0) cacheSet(cacheKey, cached);   // keep progress if the page closes
  }
  cacheSet(cacheKey, cached);
  return {ele:cached, complete:true};
}
// finish fetching elevation in the background, then rebuild the network with real slopes
async function refineElevation(token, osm, resort, pts, key, seeds){
  for (let attempt = 0; attempt < 30; attempt++){
    await new Promise(r => setTimeout(r, 65000));
    if (token !== loadToken) return;
    const res = await loadElevations(pts, key, seeds, true);
    if (!res.complete) continue;
    while (ui.nav){ await new Promise(r => setTimeout(r, 10000)); if (token !== loadToken) return; }   // don't disturb navigation
    if (token !== loadToken) return;
    G = finishGraph(buildGraph(osm, resort.bbox), res.ele);
    G.live = null;
    placeSkiers(); drawNetwork(); renderQuick(); updateMarkers();
    if (ui.view === 'route' && ui.routeFriend){ ui.route = planRoute(ui.routeFriend); ui.routeSig = ''; drawRoute(); }
    renderPanel(); refreshStatus(token, true);
    toast('Terrain loaded — speeds and slopes updated');
    return;
  }
}

/* =========================================================================
   GRAPH BUILDING
   Every OSM run/lift way is split at junction nodes. Runs are directed
   downhill, lifts uphill (checked against DEM elevation). Loose ends within
   a few dozen metres of another way are joined with short "link" edges.
   ========================================================================= */
let G = null;

function buildGraph(osm, bbox){
  const lat0 = (bbox[0] + bbox[2]) / 2, lon0 = (bbox[1] + bbox[3]) / 2;
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
  const xy = (lat, lon) => [(lon - lon0) * kx, (lat - lat0) * ky];
  const coord = new Map(), ways = [], areas = [];

  for (const e of osm.elements){
    const t = e.tags || {};
    if (e.type !== 'way' || !e.geometry){ if (t.landuse === 'winter_sports' && t.name) areas.push(t.name); continue; }
    let kind = null;
    const nm = t.name || '';
    if (t.disused === 'yes' || t.abandoned === 'yes' || t.demolished === 'yes' || t['piste:abandoned'] === 'yes' ||
        /stillgelegt|abgebaut|disused|abandoned|dismantled|désaffecté|dismesso/i.test(nm)) continue;   // decommissioned
    if (t['piste:type'] === 'downhill' && !t.aerialway){
      if (t.area === 'yes' || (e.nodes[0] === e.nodes[e.nodes.length-1] && e.nodes.length > 3)) continue; // piste areas
      kind = 'run';
    } else if (liftType(t)) kind = 'lift';
    if (!kind || e.nodes.length < 2) continue;
    e.nodes.forEach((id, i) => coord.set(id, e.geometry[i]));
    ways.push({id:e.id, kind, tags:t, ltype: kind === 'lift' ? liftType(t) : null, nodes:e.nodes.slice(), name:t.name || t['piste:name'] || '',
      rank: kind === 'run' ? (RANK[t['piste:difficulty']] || 3) : 0, unknownDiff: kind === 'run' && !RANK[t['piste:difficulty']]});
  }
  if (!ways.length) return null;

  // count how many ways touch each node
  const uses = new Map();
  ways.forEach(w => new Set(w.nodes).forEach(id => uses.set(id, (uses.get(id) || 0) + 1)));
  const split = new Set();
  uses.forEach((n, id) => { if (n > 1) split.add(id); });
  ways.forEach(w => { split.add(w.nodes[0]); split.add(w.nodes[w.nodes.length-1]); });

  // snap loose ends to the nearest vertex of another way
  const CELL = 70, grid = new Map(), cellKey = (x, y) => Math.floor(x / CELL) + ',' + Math.floor(y / CELL);
  ways.forEach((w, wi) => w.nodes.forEach(id => {
    const [lat, lon] = coord.get(id), [x, y] = xy(lat, lon), k = cellKey(x, y);
    if (!grid.has(k)) grid.set(k, []); grid.get(k).push({id, wi, x, y});
  }));
  const links = [];
  ways.forEach((w, wi) => [w.nodes[0], w.nodes[w.nodes.length-1]].forEach(end => {
    if (uses.get(end) > 1) return;
    const R = w.kind === 'lift' ? 70 : 40, [x, y] = xy(...coord.get(end));
    let best = null, bd = R;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
      for (const v of grid.get((Math.floor(x / CELL) + dx) + ',' + (Math.floor(y / CELL) + dy)) || []){
        if (v.wi === wi) continue;
        const d = Math.hypot(v.x - x, v.y - y);
        if (d < bd){ bd = d; best = v; }
      }
    }
    if (best){ split.add(best.id); links.push([end, best.id, bd]); }
  }));

  return {ways, coord, split, links, areas, xy, lat0, lon0};
}

function finishGraph(pre, ele){
  const {ways, coord, split, links, xy} = pre;
  const E = (id) => ele[id] ?? null;
  const hasEle = Object.keys(ele).length > 0;

  // orient each way: runs downhill, lifts uphill
  ways.forEach(w => {
    const a = E(w.nodes[0]), b = E(w.nodes[w.nodes.length-1]);
    if (a == null || b == null) return;
    if ((w.kind === 'run' && b - a > 15) || (w.kind === 'lift' && a - b > 15)){ w.nodes.reverse(); w.reversed = true; }
  });

  const edges = [], out = new Map(), inn = new Map(), nodes = new Map();
  const addNode = id => { if (!nodes.has(id)){ const [lat, lon] = coord.get(id); nodes.set(id, {id, lat, lon, ele: E(id)}); } };
  const addEdge = e => {
    const pts = e.ids.map(id => coord.get(id)), cum = [0];
    for (let i = 1; i < pts.length; i++){ const p = xy(...pts[i-1]), q = xy(...pts[i]); cum.push(cum[i-1] + Math.hypot(q[0]-p[0], q[1]-p[1])); }
    const h = cum[cum.length-1]; if (h < 1) return;
    const ea = E(e.from), eb = E(e.to);
    const dz = ea != null && eb != null ? eb - ea : 0;
    Object.assign(e, {pts, cum, h, eleA:ea, eleB:eb, length: Math.hypot(h, dz), vert: Math.max(0, -dz), slope: ea != null && eb != null ? Math.max(0, -dz) / h : 0.2});   // unknown height → typical slope
    addNode(e.from); addNode(e.to);
    e.idx = edges.length; edges.push(e);
    if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e);
    if (!inn.has(e.to)) inn.set(e.to, []); inn.get(e.to).push(e);
  };

  ways.forEach(w => {
    const lt = LIFT_TYPES[w.ltype];
    let speed = 0, wait = 0, label = '';
    if (w.kind === 'lift'){
      speed = lt.speed; wait = lt.wait; label = lt.label;
      if (w.tags.aerialway === 'chair_lift'){ const det = w.tags['aerialway:detachable']; speed = det === 'no' ? 2.3 : det === 'yes' ? 5 : speed; }
      w.duration = parseDuration(w.tags['aerialway:duration']);
    }
    let s = 0;
    for (let i = 1; i < w.nodes.length; i++){
      if (split.has(w.nodes[i]) || i === w.nodes.length - 1){
        addEdge({kind:w.kind, way:w, wayId:w.id, name:w.name, rank:w.rank, from:w.nodes[s], to:w.nodes[i], ids:w.nodes.slice(s, i+1), speed, wait, typeLabel:label});
        s = i;
      }
    }
  });
  // lift speed from the tagged ride duration when OSM has it
  const liftLen = new Map();
  edges.filter(e => e.kind === 'lift').forEach(e => liftLen.set(e.wayId, (liftLen.get(e.wayId) || 0) + e.length));
  edges.filter(e => e.kind === 'lift' && e.way.duration).forEach(e => e.speed = Math.min(12, Math.max(1, liftLen.get(e.wayId) / e.way.duration)));
  // short sections often look flat on a ~90 m elevation model: use the whole run's average steepness too
  if (hasEle){
    const agg = new Map();
    edges.filter(e => e.kind === 'run').forEach(e => { const a = agg.get(e.wayId) || {h:0, v:0}; a.h += e.h; a.v += e.vert; agg.set(e.wayId, a); });
    edges.filter(e => e.kind === 'run').forEach(e => { const a = agg.get(e.wayId); e.slope = Math.max(e.slope, 0.85 * a.v / Math.max(a.h, 1)); });
  }
  // enclosed lifts (cable cars, gondolas, funiculars, trains) can also be ridden down
  const RIDE_DOWN = new Set(['cable_car', 'gondola', 'mixed_lift', 'funicular', 'rack_railway']);
  edges.filter(e => e.kind === 'lift' && RIDE_DOWN.has(e.way.ltype)).forEach(e => {
    addEdge({kind:'lift', down:true, way:e.way, wayId:e.wayId + '-down', name:e.name, rank:0, from:e.to, to:e.from,
      ids:e.ids.slice().reverse(), speed:e.speed, wait:e.wait / 2, typeLabel:e.typeLabel});
  });
  links.forEach(([a, b, d]) => {
    if (d < 1){ return; }
    addEdge({kind:'link', from:a, to:b, ids:[a, b], name:'', rank:0});
    addEdge({kind:'link', from:b, to:a, ids:[b, a], name:'', rank:0});
  });

  // Sectors that only meet in a village (e.g. Zermatt's valley stations) need a short walk.
  // Join way endpoints of *different* components that are close and at a similar height.
  const pre1 = largestSCC([...nodes.keys()], out, inn).comp;
  const WR = 500, wgrid = new Map(), wk = (x, y) => Math.floor(x / WR) + ',' + Math.floor(y / WR);
  const outDeg = id => (out.get(id) || []).length, inDeg = id => (inn.get(id) || []).length;
  const deadEnd = new Set(), source = new Set();
  nodes.forEach((n, id) => { if (!outDeg(id)) deadEnd.add(id); if (!inDeg(id)) source.add(id); });
  const ends = [...new Set(ways.flatMap(w => [w.nodes[0], w.nodes[w.nodes.length-1]]))].filter(id => nodes.has(id))
    .map(id => { const [x, y] = xy(...coord.get(id)); return {id, x, y}; });
  ends.forEach(p => { const k = wk(p.x, p.y); if (!wgrid.has(k)) wgrid.set(k, []); wgrid.get(k).push(p); });
  const walked = new Set();
  // valley stations of different sectors are usually a short walk apart through the village
  // and any two lift stations close together (e.g. funicular top → gondola bottom) are a quick transfer
  const liftUp = edges.filter(e => e.kind === 'lift' && !e.down);
  const valley = new Set(liftUp.map(e => e.from)), stations = new Set(liftUp.flatMap(e => [e.from, e.to]));
  const VR = 1500, vlist = [...stations].map(id => { const [x, y] = xy(...coord.get(id)); return {id, x, y, valley: valley.has(id)}; });
  vlist.forEach(p => vlist.forEach(q => {
    if (p.id >= q.id || pre1.get(p.id) === pre1.get(q.id)) return;
    const d = Math.hypot(q.x - p.x, q.y - p.y), za = E(p.id), zb = E(q.id);
    const R = p.valley && q.valley ? VR : 200;
    if (d > R || d < 1 || (za != null && zb != null && Math.abs(za - zb) > (R === VR ? 80 : 50))) return;
    [[p.id, q.id], [q.id, p.id]].forEach(([a, b]) => { const k = a + '>' + b; if (!walked.has(k)){ walked.add(k); addEdge({kind:'link', walk:true, from:a, to:b, ids:[a, b], name:'', rank:0}); } });
  }));
  ends.forEach(p => {
    if (!deadEnd.has(p.id) && !source.has(p.id)) return;   // only stranded ends need a walk
    const bestBy = new Map();
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++){
      for (const q of wgrid.get((Math.floor(p.x / WR) + dx) + ',' + (Math.floor(p.y / WR) + dy)) || []){
        const c = pre1.get(q.id); if (c === pre1.get(p.id)) continue;
        const d = Math.hypot(q.x - p.x, q.y - p.y); if (d > WR || d < 1) continue;
        const za = E(p.id), zb = E(q.id); if (za != null && zb != null && Math.abs(za - zb) > 80) continue;
        if (!bestBy.has(c) || bestBy.get(c).d > d) bestBy.set(c, {q, d});
      }
    }
    bestBy.forEach(({q}) => {
      const walk = (a, b) => { const k = a + '>' + b; if (walked.has(k)) return; walked.add(k);
        addEdge({kind:'link', walk:true, from:a, to:b, ids:[a, b], name:'', rank:0}); };
      if (deadEnd.has(p.id)) walk(p.id, q.id);   // run ends here → walk on
      if (source.has(p.id)) walk(q.id, p.id);    // lift station nothing leads to → walk there
    });
  });

  // keep the largest strongly-connected component for routing & simulation
  const {comp, best} = largestSCC([...nodes.keys()], out, inn);
  edges.forEach(e => { e.main = comp.get(e.from) === best && comp.get(e.to) === best; e.cost = edgeCost(e, 1); });
  return {edges, out, inn, nodes, ways, hasEle, mainNodes: [...nodes.keys()].filter(id => comp.get(id) === best)};
}

function parseDuration(v){
  if (!v) return 0;
  let m;
  if ((m = /^(\d+(?:\.\d+)?)$/.exec(v))) return +m[1] * 60;
  if ((m = /^(\d+):(\d{1,2})$/.exec(v))) return +m[1] * 60 + +m[2];
  if ((m = /^PT(?:(\d+)M)?(?:(\d+)S)?$/.exec(v))) return (+m[1] || 0) * 60 + (+m[2] || 0);
  return 0;
}

function largestSCC(ids, out, inn){
  const seen = new Set(), order = [];
  for (const s of ids){
    if (seen.has(s)) continue;
    seen.add(s); const st = [[s, 0]];
    while (st.length){
      const top = st[st.length-1], es = out.get(top[0]) || [];
      if (top[1] < es.length){ const t = es[top[1]++].to; if (!seen.has(t)){ seen.add(t); st.push([t, 0]); } }
      else { order.push(top[0]); st.pop(); }
    }
  }
  const comp = new Map(); let best = -1, bestSize = 0, c = 0;
  for (let i = order.length - 1; i >= 0; i--){
    const s = order[i]; if (comp.has(s)) continue;
    let size = 0; const st = [s]; comp.set(s, c);
    while (st.length){ const u = st.pop(); size++; for (const e of inn.get(u) || []) if (!comp.has(e.from)){ comp.set(e.from, c); st.push(e.from); } }
    if (size > bestSize){ bestSize = size; best = c; }
    c++;
  }
  return {comp, best};
}

/* =========================================================================
   SPEEDS, ROUTING
   ========================================================================= */
// cruising speed on a run depends on its steepness (from DEM) and the skier
function runSpeed(e, factor){ return Math.min(75, Math.max(12, 18 + 90 * Math.min(e.slope, 0.6))) * factor / 3.6; }
function edgeCost(e, factor){
  if (e.kind === 'lift') return e.length / e.speed + (e.wait || 0) * 60;
  if (e.kind === 'link') return e.walk ? e.h / 1.2 + 30 : e.length / 2 + 5;
  return e.length / runSpeed(e, factor);
}
function heapPush(h, x){ h.push(x); let i = h.length - 1; while (i){ const p = (i - 1) >> 1; if (h[p][0] <= h[i][0]) break; [h[p], h[i]] = [h[i], h[p]]; i = p; } }
function heapPop(h){
  const top = h[0], last = h.pop();
  if (h.length){ h[0] = last; let i = 0; for (;;){ const l = 2*i+1, r = l+1; let m = i;
    if (l < h.length && h[l][0] < h[m][0]) m = l; if (r < h.length && h[r][0] < h[m][0]) m = r;
    if (m === i) break; [h[m], h[i]] = [h[i], h[m]]; i = m; } }
  return top;
}
function dijkstra(start, goal, maxRank){
  const dist = new Map([[start, 0]]), prev = new Map(), h = [[0, start]];
  while (h.length){
    const [d, u] = heapPop(h);
    if (d > dist.get(u)) continue;
    if (u === goal) break;
    for (const e of G.out.get(u) || []){
      if (!e.main || (e.kind === 'run' && e.rank > maxRank) || (e.shut && G.live && G.live.enforce)) continue;
      const nd = d + e.cost;
      if (nd < (dist.has(e.to) ? dist.get(e.to) : Infinity)){ dist.set(e.to, nd); prev.set(e.to, e); heapPush(h, [nd, e.to]); }
    }
  }
  if (!dist.has(goal)) return null;
  const edges = [];
  for (let n = goal; n !== start; n = prev.get(n).from) edges.unshift(prev.get(n));
  return {edges, time: dist.get(goal)};
}

function posAt(e, d){
  const c = e.cum, hd = Math.max(0, Math.min(e.h, d * e.h / e.length));
  let lo = 0, hi = c.length - 1;
  while (hi - lo > 1){ const m = (lo + hi) >> 1; if (c[m] <= hd) lo = m; else hi = m; }
  const t = (hd - c[lo]) / ((c[hi] - c[lo]) || 1), p = e.pts[lo], q = e.pts[hi];
  return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
}
const eleAt = (e, d) => e.eleA == null ? null : e.eleA + (e.eleB - e.eleA) * Math.min(1, d / e.length);

function nodeLabel(id){
  const outs = G.out.get(id) || [], ins = G.inn.get(id) || [];
  const lo = outs.find(e => e.kind === 'lift' && !e.down), li = ins.find(e => e.kind === 'lift' && !e.down);
  if (lo) return `bottom of ${lo.name || lo.typeLabel}`;
  if (li) return `top of ${li.name || li.typeLabel}`;
  const names = [...new Set([...outs, ...ins].filter(e => e.kind === 'run' && e.name).map(e => e.name))];
  if (names.length >= 2) return `${names[0]} / ${names[1]}`;
  if (names.length === 1) return `on ${names[0]}`;
  return 'trail junction';
}
const edgeName = e => e.kind === 'link' ? 'short traverse' : e.name || (e.kind === 'lift' ? 'unnamed ' + e.typeLabel.toLowerCase() : 'unnamed run');

/* =========================================================================
   SKIERS (simulated friends — the real app would stream GPS positions)
   ========================================================================= */
const mkStats = (top, vert, runs, km) => ({top, vert, runs, dist: km * 1000});
const you = {id:'you', name:'You', initials:'ME', color:'#1a73e8', isYou:true, maxRank:5, factor:1, navQueue:[], stats:mkStats(66.1, 5320, 13, 17.4)};
const friends = [
  {id:'maya',  name:'Maya',  color:'#e4572e', maxRank:5, factor:1.15, stats:mkStats(78.4, 7420, 17, 21.3)},
  {id:'leo',   name:'Leo',   color:'#7b2cbf', maxRank:4, factor:1.05, stats:mkStats(71.2, 6980, 15, 19.8)},
  {id:'priya', name:'Priya', color:'#e09f3e', maxRank:5, factor:1.10, stats:mkStats(74.9, 5900, 14, 16.9)},
  {id:'sam',   name:'Sam',   color:'#0a9396', maxRank:3, factor:0.92, stats:mkStats(58.3, 4870, 12, 15.2)},
  {id:'jonah', name:'Jonah', color:'#3a86ff', maxRank:2, factor:0.78, stats:mkStats(39.5, 2210,  9,  8.6)},
];
friends.forEach(f => Object.assign(f, {initials: f.name.slice(0, 2).toUpperCase(), phase: Math.random() * 6}));
const skiers = [you, ...friends];
const byId = id => skiers.find(s => s.id === id);
const pick = a => a[Math.floor(Math.random() * a.length)];

function placeSkiers(){
  const main = G.edges.filter(e => e.main && e.kind !== 'link');
  friends.forEach(f => {
    const ok = main.filter(e => e.kind === 'lift' || e.rank <= f.maxRank);
    const e = pick(ok.length ? ok : main);
    Object.assign(f, {edge:e, node:e.from, d:Math.random() * e.length * 0.8, speed: e.kind === 'lift' ? e.speed : 8,
      state: e.kind === 'lift' ? 'riding' : 'skiing', t: Math.random() * 100, burst: 0, holdAt: null, prevNode: null, lastWay: e.wayId});
  });
  // you start at the lowest lift station (usually the base area)
  const bases = main.filter(e => e.kind === 'lift' && !e.down).sort((a, b) => (a.eleA ?? 0) - (b.eleA ?? 0));
  Object.assign(you, {edge:null, node: bases.length ? bases[0].from : main[0].from, d:0, speed:0, state:'idle', t:0, burst:0, navQueue:[], lastWay:null});
}

function allowed(sk, e){ return (e.kind !== 'run' || e.rank <= sk.maxRank) && !(e.shut && G.live && G.live.enforce); }

function startEdge(sk, e){
  const boarding = e.kind === 'lift' && sk.lastWay !== e.wayId;
  if (boarding && sk.lastKind === 'run') sk.stats.runs++;
  sk.edge = e; sk.node = e.from; sk.d = 0; sk.lastWay = e.wayId; sk.lastKind = e.kind === 'link' ? sk.lastKind : e.kind;
  if (e.kind === 'lift'){
    if (boarding){ sk.state = 'queue'; sk.queueLeft = e.wait * 60 * (sk.isYou ? 0.6 : 0.3 + Math.random() * 0.8); sk.speed = 0; }
    else sk.state = 'riding';
  } else {
    sk.state = 'skiing';
    if (e.kind === 'run' && Math.random() < 0.1) sk.burst = Math.random() < 0.4 ? Math.random() * 0.3 : 0;
  }
}
function chooseNext(sk){
  let outs = (G.out.get(sk.node) || []).filter(e => e.main);
  if (!outs.length){ // dead end: respawn at a lift
    const lifts = G.edges.filter(e => e.main && e.kind === 'lift');
    sk.node = pick(lifts).from; outs = G.out.get(sk.node).filter(e => e.main);
  }
  const ok = outs.filter(e => allowed(sk, e)), cand = ok.length ? ok : outs;
  const w = cand.map(e => {
    if (e.kind === 'link') return e.to === sk.prevNode ? 0.02 : 0.5;
    if (e.kind === 'lift') return e.down ? 0.15 : e.wayId === sk.lastWay ? 5 : 1;
    return (e.wayId === sk.lastWay ? 3 : 1) * (e.rank >= sk.maxRank - 1 ? 1.5 : 0.8);
  });
  let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while ((r -= w[i]) > 0 && i < cand.length - 1) i++;
  sk.prevNode = sk.node;
  startEdge(sk, cand[i]);
}

function step(sk, dt){
  sk.t += dt;
  if (sk.state === 'idle' || sk.state === 'waiting'){ sk.speed = 0; return; }
  if (sk.state === 'queue'){ sk.speed = 0; sk.queueLeft -= dt; if (sk.queueLeft <= 0) sk.state = 'riding'; return; }
  const e = sk.edge;
  if (e.kind === 'lift') sk.speed = e.speed;
  else {
    const target = e.kind === 'link' ? (e.walk ? 1.3 : 3) : runSpeed(e, sk.factor) * (0.82 + 0.18*Math.sin(sk.t*0.33 + sk.phase) + 0.1*Math.sin(sk.t*1.27 + sk.phase*2) + sk.burst);
    sk.speed += (target - sk.speed) * Math.min(1, dt * 0.6);
  }
  const z0 = eleAt(e, sk.d);
  sk.d += sk.speed * dt;
  if (e.kind === 'run'){
    sk.stats.dist += sk.speed * dt;
    if (z0 != null) sk.stats.vert += Math.max(0, z0 - eleAt(e, sk.d));
    sk.stats.top = Math.max(sk.stats.top, sk.speed * 3.6);
  }
  if (sk.d >= e.length) arrive(sk);
}

function arrive(sk){
  const e = sk.edge;
  sk.node = e.to; sk.edge = null; sk.d = 0;
  if (sk.isYou){
    if (sk.navQueue.length){ startEdge(sk, sk.navQueue.shift()); drawRoute(); }
    else { sk.state = 'idle'; sk.speed = 0; drawRoute(); checkMeet(); }
    return;
  }
  if (sk.holdAt === sk.node){ sk.state = 'waiting'; sk.speed = 0; checkMeet(); return; }
  chooseNext(sk);
}

function remainingOnEdge(sk){
  const e = sk.edge; if (!e) return 0;
  if (e.kind === 'lift') return (sk.state === 'queue' ? sk.queueLeft : 0) + (e.length - sk.d) / e.speed;
  return (e.length - sk.d) / (e.kind === 'link' ? (e.walk ? 1.2 : 2) : runSpeed(e, sk.factor));
}

   ========================================================================= */
const ui = {tab:'friends', view:'tabs', routeFriend:null, route:null, nav:null, maxRank:5, lbMetric:'top', sim:5, selected:null, routeSig:'', placing:false};

function planRoute(f){
  const meet = f.state === 'waiting' ? f.node : (f.holdAt || (f.edge ? f.edge.to : f.node));
  const friendEta = f.state === 'waiting' ? 0 : remainingOnEdge(f);
  const start = you.edge ? you.edge.to : you.node, pre = remainingOnEdge(you);
  // one candidate per difficulty limit: the fastest way using only runs up to that level
  const options = [];
  for (const [cap] of SCHEME.levels){
    const r = dijkstra(start, meet, cap); if (!r) continue;
    const sig = r.edges.map(e => e.idx).join();
    const same = options.find(o => o.sig === sig);
    if (same){ same.caps.push(cap); continue; }
    const runs = r.edges.filter(e => e.kind === 'run');
    const mix = {}; runs.forEach(e => mix[e.rank] = (mix[e.rank] || 0) + e.length);
    options.push({sig, caps:[cap], edges:r.edges, time: pre + r.time, mix,
      hardest: runs.reduce((a, e) => Math.max(a, e.rank), 0),
      skiKm: runs.reduce((a, e) => a + e.length, 0) / 1000,
      lifts: new Set(r.edges.filter(e => e.kind === 'lift').map(e => e.wayId)).size,
      walk: r.edges.filter(e => e.walk).reduce((a, e) => a + e.h, 0)});
  }
  if (!options.length) return {error:true, meet, friendEta, start, options};
  options.forEach((o, i) => {
    o.name = options.length === 1 ? 'Best route' : i === 0 ? 'Easiest' : i === options.length - 1 ? 'Fastest'
           : options.length === 3 ? 'Balanced' : `Balanced · ${style(o.hardest).label}`;
    o.key = o.caps[o.caps.length - 1];
  });
  // keep the option the user picked (by difficulty limit); default = fastest
  const pick = options.find(o => o.caps.includes(ui.maxRank)) || options.find(o => o.key > ui.maxRank) || options[options.length - 1];
  return {meet, friendEta, start, options, pick, edges:pick.edges, time:pick.time, current: you.edge};
}
function openRoute(id){
  if (ui.nav && id !== ui.nav.friend.id){ toast(`End navigation to ${ui.nav.friend.name} first`); id = ui.nav.friend.id; }
  ui.view = 'route'; ui.routeFriend = byId(id); ui.selected = id; ui.routeSig = '';
  if (!ui.nav) ui.route = planRoute(ui.routeFriend);
  if (isMobile() && ui.sheet === 'peek') setSheet('half');
  renderPanel(); drawRoute(); fitRoute();
}
function startNav(){
  const f = ui.routeFriend, r = ui.route;
  if (!r || r.error) return;
  ui.nav = {friend:f, meet:r.meet, optName:r.pick.name, hardest:r.pick.hardest};
  f.holdAt = r.meet;
  you.navQueue = r.edges.slice();
  if (!you.edge && you.navQueue.length) startEdge(you, you.navQueue.shift());
  toast(`📍 Asked ${f.name} to wait for you at the ${nodeLabel(r.meet)}`);
  askNotify().then(ok => { if (!ok) toast(`Tip: allow notifications to see your progress to ${f.name} from your lock screen`); updateBanner(); });
  updateBanner(); setSheet('peek'); setTimeout(fitRoute, 350);
  ui.routeSig = ''; renderPanel(); drawRoute(); checkMeet();
}
function stopNav(msg){
  const f = ui.nav && ui.nav.friend;
  if (f){ f.holdAt = null; if (f.state === 'waiting') setTimeout(() => { if (f.state === 'waiting' && !f.holdAt) chooseNext(f); }, 2500); }
  ui.nav = null; you.navQueue = [];
  endPresence(msg && msg.includes('met up') ? msg : null); updateBanner();
  if (msg) toast(msg);
  if (ui.routeFriend) ui.route = planRoute(ui.routeFriend);
  ui.routeSig = ''; renderPanel(); drawRoute();
}
function checkMeet(){
  const n = ui.nav; if (!n) return;
  const f = n.friend;
  if (!you.edge && you.node === n.meet && f.state === 'waiting' && f.node === n.meet) stopNav(`🎉 You met up with ${f.name} at the ${nodeLabel(n.meet)}!`);
}

  attribution:'Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Style © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA) | Elevation: Open-Meteo'}).addTo(map);

map.setView([43.59, -110.84], 13);
const L_net = L.layerGroup().addTo(map), L_labels = L.layerGroup(), L_hl = L.layerGroup().addTo(map), L_route = L.layerGroup().addTo(map);

function drawNetwork(){
  L_net.clearLayers(); L_labels.clearLayers(); L_hl.clearLayers(); L_route.clearLayers();
  const byWay = new Map();
  G.edges.forEach(e => { if (e.kind !== 'link' && !e.down){ if (!byWay.has(e.wayId)) byWay.set(e.wayId, []); byWay.get(e.wayId).push(e); } });
  const runs = [], lifts = [];
  byWay.forEach(es => (es[0].kind === 'run' ? runs : lifts).push(es));
  // easier runs drawn first so harder ones sit on top
  runs.sort((a, b) => a[0].rank - b[0].rank).forEach(es => {
    const e0 = es[0], s = style(e0.rank), lines = es.map(e => e.pts), st = e0.way.live, off = st === 'closed' || st === 'scheduled';
    L.polyline(lines, {renderer:canvas, color:'#fff', weight:7, opacity:off ? .45 : .85, interactive:false}).addTo(L_net);
    const len = es.reduce((a, e) => a + e.length, 0), vert = es.reduce((a, e) => a + e.vert, 0);
    L.polyline(lines, {renderer:canvas, color:s.color, weight:off ? 2.5 : 3.5, opacity:off ? .35 : 1, dashArray:off ? '3 6' : s.dash})
      .bindTooltip(`<b>${e0.name || 'Unnamed run'}</b> ${statusPill(st)}<br>${s.label}${e0.way.unknownDiff ? ' (difficulty not tagged)' : ''} · ${(len/1000).toFixed(1)} km${vert ? ` · ${Math.round(vert)} m ↓` : ''}`, {sticky:true})
      .on('click', () => flashEdges(es)).addTo(L_net);
  });
  lifts.forEach(es => {
    const e0 = es[0], lines = es.map(e => e.pts), len = es.reduce((a, e) => a + e.length, 0), st = e0.way.live, off = st === 'closed' || st === 'scheduled';
    L.polyline(lines, {renderer:canvas, color:'#fff', weight:5, opacity:off ? .5 : .9, interactive:false}).addTo(L_net);
    L.polyline(lines, {renderer:canvas, color:off ? '#9aa3ad' : st === 'open' ? '#0f7a3d' : '#20232a', weight:off ? 2 : 2.6, dashArray:off ? '4 5' : null})
      .bindTooltip(`<b>${e0.name || e0.typeLabel}</b> ${statusPill(st)}<br>${e0.typeLabel} · ${(len/1000).toFixed(1)} km · ${Math.round(len / e0.speed / 60)} min ride`, {sticky:true})
      .on('click', () => flashEdges(es)).addTo(L_net);
    [es[0].pts[0], es[es.length-1].pts[es[es.length-1].pts.length-1]].forEach(p =>
      L.circleMarker(p, {renderer:canvas, radius:3.5, color:'#20232a', weight:2, fillColor:'#fff', fillOpacity:1, interactive:false}).addTo(L_net));
  });
  // one label per run/lift name, at the midpoint of its longest way
  const best = new Map();
  byWay.forEach(es => { const n = es[0].name; if (!n) return; const len = es.reduce((a, e) => a + e.h, 0);
    const k = es[0].kind + n; if (!best.has(k) || best.get(k).len < len) best.set(k, {es, len}); });
  best.forEach(({es, len}) => {
    if (len < 250) return;
    let acc = 0, mid = es[0];
    for (const e of es){ if (acc + e.h >= len / 2){ mid = e; break; } acc += e.h; }
    const p = posAt(mid, (len / 2 - acc) * mid.length / mid.h), lift = mid.kind === 'lift';
    L.marker(p, {interactive:false, icon:L.divIcon({className:'', iconSize:[0,0],
      html:`<span class="lbl${lift ? ' lift' : ''}" style="${lift ? '' : 'color:' + style(mid.rank).color}">${mid.name}</span>`})}).addTo(L_labels);
  });
  updateLabels();
}
function updateLabels(){
  if (map.getZoom() >= 15) L_labels.addTo(map); else L_labels.remove();
  document.getElementById('map').classList.toggle('far', map.getZoom() < 13.5);   // hide name tags when zoomed out
}
map.on('zoomend', updateLabels);

};
function glyphFor(sk){ return sk.state === 'skiing' ? 'ski' : sk.state === 'riding' || sk.state === 'queue' ? 'lift' : 'stand'; }

function makeMarkers(){
  skiers.forEach(sk => {
    if (sk.marker) return;
    const html = sk.isYou ? `<div class="me"><div class="halo"></div><div class="dot"></div><div class="you">You</div></div>`
      : `<div class="sk" style="--c:${sk.color}"><div class="pinb"><div class="ring"></div><div class="glyph">${GLYPH.ski}</div></div><div class="tag"><span>${sk.name}</span><span class="spd"></span></div></div>`;
    const icon = sk.isYou ? L.divIcon({className:'', html, iconSize:[24, 24], iconAnchor:[12, 12]})
                          : L.divIcon({className:'', html, iconSize:[44, 60], iconAnchor:[22, 58]});
    sk.marker = L.marker([0, 0], {icon, zIndexOffset: sk.isYou ? 1000 : 500})
      .on('click', () => { if (sk.isYou) toast(statusPlain(you)); else { ui.tab = 'friends'; openRoute(sk.id); } })
      .addTo(map);
    const el = sk.marker.getElement();
    sk.spdEl = el.querySelector('.spd'); sk.skEl = el.querySelector('.sk'); sk.glyphEl = el.querySelector('.glyph'); sk.glyphKind = 'ski';
  });
}
function skierPos(sk){
  if (sk.edge && sk.state !== 'queue') return posAt(sk.edge, sk.d);
  if (sk.edge) return sk.edge.pts[0];
  const n = G.nodes.get(sk.node); return [n.lat, n.lon];
}
function skierEle(sk){
  if (sk.edge) return eleAt(sk.edge, sk.state === 'queue' ? 0 : sk.d);
  return G.nodes.get(sk.node).ele;
}
function updateMarkers(){
  skiers.forEach(sk => {
    const p = skierPos(sk), dLon = sk.lon == null ? 0 : p[1] - sk.lon;
    sk.lat = p[0]; sk.lon = p[1];
    sk.marker.setLatLng(p);
    if (!sk.isYou){
      const moving = sk.state === 'skiing' && sk.speed > 1;
      sk.spdEl.textContent = moving ? '· ' + Math.round(sk.speed * 3.6) + ' km/h' : sk.state === 'waiting' ? '· waiting' : '';
      sk.skEl.classList.toggle('sel', ui.selected === sk.id);
      const g = glyphFor(sk);
      if (g !== sk.glyphKind){ sk.glyphKind = g; sk.glyphEl.innerHTML = GLYPH[g]; }
      if (Math.abs(dLon) > 1e-7) sk.glyphEl.classList.toggle('flip', dLon < 0);   // face the direction of travel
    }
  });
}

function drawRoute(){
  L_route.clearLayers();
  let edges = [], meet = null;
  if (ui.nav){ edges = (you.edge ? [you.edge] : []).concat(you.navQueue); meet = ui.nav.meet; }
  else if (ui.view === 'route' && ui.route && !ui.route.error){
    edges = (ui.route.current ? [ui.route.current] : []).concat(ui.route.edges); meet = ui.route.meet;
    // the other options, faint and tappable
    ui.route.options.filter(o => o !== ui.route.pick).forEach(o => {
      const lines = o.edges.map(e => e.pts);
      L.polyline(lines, {renderer:svgR, color:'#fff', weight:8, opacity:.7, lineCap:'round', interactive:false}).addTo(L_route);
      L.polyline(lines, {renderer:svgR, color:'#7c3aed', weight:4.5, opacity:.4, dashArray:'2 7', lineCap:'round'})
        .bindTooltip(`<b>${o.name}</b> · ${fmtT(o.time)}${o.hardest ? ' · hardest: ' + style(o.hardest).label : ''}<br><small>Tap to choose this route</small>`, {sticky:true})
        .on('click', ev => { L.DomEvent.stop(ev); pickOption(o.key); }).addTo(L_route);
    });
  }
  if (edges.length){
    const lines = edges.map(e => e.pts);
    L.polyline(lines, {renderer:svgR, color:'#fff', weight:11, opacity:.95, interactive:false, lineCap:'round'}).addTo(L_route);
    L.polyline(lines, {renderer:svgR, color:'#7c3aed', weight:5.5, interactive:false, className:'route-line', lineCap:'round'}).addTo(L_route);
  }
  if (meet != null){
    const n = G.nodes.get(meet);
    L.marker([n.lat, n.lon], {interactive:false, zIndexOffset:900, icon:L.divIcon({className:'', iconSize:[30,40], iconAnchor:[15,40],
      html:`<svg class="pin" viewBox="0 0 30 40"><path d="M15 39C11 29 2 24 2 14a13 13 0 0 1 26 0c0 10-9 15-13 25Z" fill="#7c3aed" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14" r="5" fill="#fff"/></svg>`})}).addTo(L_route);
  }
}
function flashEdges(es){
  L_hl.clearLayers();
  L.polyline(es.map(e => e.pts), {renderer:svgR, color:'#ffd166', weight:13, className:'hl-line', interactive:false}).addTo(L_hl);
  clearTimeout(flashEdges.t); flashEdges.t = setTimeout(() => L_hl.clearLayers(), 3500);
  map.flyToBounds(L.latLngBounds(es.flatMap(e => e.pts)), {...mapPad(), maxZoom:16, duration:0.6});
}
function fitResort(){
  const b = L.latLngBounds(G.edges.filter(e => e.main).flatMap(e => [e.pts[0], e.pts[e.pts.length-1]]));
  if (b.isValid()) map.fitBounds(b, isMobile() ? mapPad() : {padding:[30, 30]});
}
function fitRoute(){
  const pts = [[you.lat, you.lon]];
  if (ui.routeFriend) pts.push([ui.routeFriend.lat, ui.routeFriend.lon]);
  if (ui.route && !ui.route.error) ui.route.edges.forEach(e => pts.push(...e.pts));
  map.flyToBounds(L.latLngBounds(pts.filter(p => p[0] != null)), {...mapPad(), maxZoom:16, duration:0.6});
}
function nearestMainNode(lat, lon){
  let best = null, bd = Infinity;
  const kx = Math.cos(lat * Math.PI / 180);
  for (const id of G.mainNodes){ const n = G.nodes.get(id), d = ((n.lat - lat) ** 2 + ((n.lon - lon) * kx) ** 2); if (d < bd){ bd = d; best = id; } }
  return {id: best, meters: Math.sqrt(bd) * 111000};
}
function moveYouTo(id, msg){
  if (ui.nav){ toast('End navigation first to move your position'); return; }
  Object.assign(you, {edge:null, node:id, state:'idle', speed:0, navQueue:[]});
  toast(msg || `You're at the ${nodeLabel(id)}`);
  if (ui.view === 'route' && ui.routeFriend){ ui.route = planRoute(ui.routeFriend); ui.routeSig = ''; renderPanel(); drawRoute(); }
}
map.on('click', e => {
  if (!ui.placing || !G) return;
  ui.placing = false; document.getElementById('bPlace').classList.remove('on');
  moveYouTo(nearestMainNode(e.latlng.lat, e.latlng.lng).id);
});

const content = document.getElementById('content');
const fmtT = s => s < 60 ? `${Math.max(0, Math.round(s))} s` : s < 3600 ? `${Math.round(s/60)} min` : `${Math.floor(s/3600)} h ${Math.round(s%3600/60)} min`;
const fmtKm = m => m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`;
function diffIcon(rank, s = 14){
  const st = style(rank), c = st.color;
  if (st.key === 'green') return `<svg width="${s}" height="${s}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="${c}"/></svg>`;
  if (st.key === 'blue' && SCHEME === SCHEMES.na) return `<svg width="${s}" height="${s}" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" fill="${c}"/></svg>`;
  if (st.key === 'black' && SCHEME === SCHEMES.na) return `<svg width="${s}" height="${s}" viewBox="0 0 14 14"><path d="M7 1 13 7 7 13 1 7Z" fill="${c}"/></svg>`;
  if (st.key === 'double') return `<svg width="${s*1.6}" height="${s}" viewBox="0 0 22 14"><path d="M6 2 10 7 6 12 2 7Z M16 2 20 7 16 12 12 7Z" fill="${c}"/></svg>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="${c}"/></svg>`;   // EU: coloured dot
}
const liftIcon = (s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="#3b3f45" stroke-width="1.6" stroke-linecap="round"><path d="M1 3 15 1"/><path d="M8 2v5"/><path d="M4 7h8v4H4z"/><path d="M4 11v3M12 11v3"/></svg>`;
const avatar = (sk, sm) => `<div class="avatar${sm ? ' sm' : ''}" style="background:${sk.color}" title="${sk.name}">${sk.isYou ? sk.initials : GLYPH.ski}</div>`;

function statusHTML(sk){
  if (sk.state === 'waiting') return `⏳ Waiting for you at the ${nodeLabel(sk.node)}`;
  if (sk.state === 'idle') return `📍 At the ${nodeLabel(sk.node)}`;
  const e = sk.edge;
  if (sk.state === 'queue') return `${liftIcon(12)} In line for ${edgeName(e)}`;
  if (sk.state === 'riding') return `${liftIcon(12)} Riding ${edgeName(e)}`;
  if (e.kind === 'link') return e.walk ? `🚶 Walking to the next lift` : `⛷ Traversing`;
  return `${diffIcon(e.rank, 11)} Skiing ${edgeName(e)}`;
}
const statusPlain = sk => statusHTML(sk).replace(/<svg[\s\S]*?<\/svg>/g, '').trim();
const eleText = sk => { const z = skierEle(sk); return z == null ? '' : ` · ${Math.round(z).toLocaleString()} m`; };

function trailGroups(){
  const groups = new Map();
  G.edges.forEach(e => {
    if (e.kind === 'link' || e.down) return;
    const k = e.kind + '|' + (e.name || '#' + e.wayId) + '|' + e.rank;
    if (!groups.has(k)) groups.set(k, {kind:e.kind, name:e.name, rank:e.rank, typeLabel:e.typeLabel, edges:[], len:0, vert:0, speed:e.speed});
    const g = groups.get(k); g.edges.push(e); g.len += e.length; g.vert += e.vert;
  });
  return [...groups.values()];
}
function groupStatus(g){
  const sts = g.edges.map(e => e.way.live).filter(Boolean);
  return sts.includes('open') ? 'open' : sts.includes('scheduled') ? 'scheduled' : sts.length ? 'closed' : null;
}

    ${unnamed ? `<p class="hint">+ ${unnamed} unnamed run sections on the map.</p>` : ''}

function buildSteps(edges){
  const steps = [];
  for (const e of edges){
    const last = steps[steps.length - 1];
    if (e.kind === 'link' && e.walk && e.h >= 60){
      if (last && last.kind === 'walk'){ last.time += e.cost; last.len += e.h; }
      else steps.push({kind:'walk', name:'', time:e.cost, len:e.h, vert:0, rank:0});
      continue;
    }
    if (e.kind === 'link'){ if (last){ last.time += e.cost; last.linkLen = (last.linkLen || 0) + e.length; } else steps.push({kind:'link', name:'', time:e.cost, len:e.length, vert:0, rank:0}); continue; }
    const key = e.kind + '|' + (e.name || '#' + e.wayId);
    if (last && last.key === key){ last.time += e.cost; last.len += e.length; last.vert += e.vert; last.rank = Math.max(last.rank, e.rank); continue; }
    steps.push({key, kind:e.kind, name:edgeName(e) + (e.down ? ' down' : ''), rank:e.rank, time:e.cost, len:e.length, vert:e.vert, typeLabel:e.typeLabel, wait:e.wait, first:e});
  }
  return steps;
}

          <span class="mix">${[1, 2, 3, 4, 5].filter(k => o.mix[k]).map(k => `<i style="width:${(o.mix[k] / total * 100).toFixed(1)}%;background:${style(k).color}" title="${style(k).label}: ${fmtKm(o.mix[k])}"></i>`).join('')}</span>
          <span class="meta">${o.skiKm.toFixed(1)} km skiing · ${o.lifts} lift${o.lifts === 1 ? '' : 's'}${o.walk >= 60 ? ` · ${fmtKm(o.walk)} walk` : ''}</span>
        </button>`; }).join('')}</div>
      <p class="hint" style="margin-bottom:12px">Each option is the quickest way using only runs up to that difficulty. Fainter lines on the map show the alternatives — tap one to switch.</p>
      <div class="section-title">Directions · ${r.pick.name}</div>`;
  } else {
    html += `<div class="section-title">Directions · ${nav.optName}${nav.hardest ? ` · up to ${style(nav.hardest).label.toLowerCase()}` : ''}</div>`;
  }

    <div class="eta">
      <div class="card"><div class="lab">You arrive in</div><div class="val" id="rYou">–</div></div>

    <div class="meetbox" id="rMeet"></div>
    <ol class="steps">
      <li class="step"><div class="ic"><span style="width:12px;height:12px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-shadow:0 0 0 1px #1a73e8"></span></div>
        <div><div class="ttl">${you.edge ? 'You' : 'Start at the ' + nodeLabel(you.node)}</div><div class="sub">${you.edge ? statusPlain(you) : 'Your current position'}</div></div><div></div></li>
      ${steps.map(s => `
      <li class="step">
        <div class="ic">${s.kind === 'lift' ? liftIcon(14) : s.kind === 'link' ? '⛷' : s.kind === 'walk' ? '🚶' : diffIcon(s.rank, 12)}</div>
        <div><div class="ttl">${s.kind === 'lift' ? 'Ride ' + s.name : s.kind === 'link' ? 'Short traverse' : s.kind === 'walk' ? 'Walk to the next lift' : 'Ski ' + s.name}</div>
          <div class="sub">${s.kind === 'lift' ? `${s.typeLabel} · ${fmtKm(s.len)} · ~${s.wait} min line` : s.kind === 'link' || s.kind === 'walk' ? fmtKm(s.len) + (s.kind === 'walk' ? ' on foot' : '') :`${style(s.rank).label} · ${fmtKm(s.len)}${s.vert ? ` · ${Math.round(s.vert)} m ↓` : ''}`}</div></div>
        <div class="tm">${fmtT(s.time)}</div>
      </li>`).join('')}
      <li class="step"><div class="ic">📍</div><div><div class="ttl">Meet ${f.name}</div><div class="sub">At the ${nodeLabel(meet)}${G.nodes.get(meet).ele != null ? ` · ${Math.round(G.nodes.get(meet).ele).toLocaleString()} m` : ''}</div></div><div></div></li>
    </ol>
    ${nav ? `<button class="btn" style="width:100%" data-action="cancel">✕ End navigation</button>`
          : `<button class="btn route" style="width:100%;padding:12px" data-action="go">▶ Start · ask ${f.name} to wait</button>
             <p class="hint" style="margin-top:10px">🔔 Once you start, your progress shows in your notifications and as minutes-left on the PisteMap app icon, so you can check it from your lock screen.</p>`}`;
  content.innerHTML = html;

}
function updateRoute(){
  const f = ui.routeFriend; if (!f) return;
  const st = document.getElementById('rStatus'); if (st) st.innerHTML = statusHTML(f) + ` · ${Math.round(f.speed * 3.6)} km/h`;
  const yEl = document.getElementById('rYou'); if (!yEl) return;
  const nav = ui.nav, r = ui.route;
  const meet = nav ? nav.meet : r.meet;
  const youT = nav ? remainingOnEdge(you) + you.navQueue.reduce((a, e) => a + e.cost, 0) : r.time;
  const fT = f.state === 'waiting' && f.node === meet ? 0 : remainingOnEdge(f);
  yEl.textContent = youT < 1 ? 'Here' : fmtT(youT);
  document.getElementById('rFriend').textContent = fT < 1 ? (f.state === 'waiting' ? 'Waiting' : 'Here') : fmtT(fT);
  const where = nodeLabel(meet);
  document.getElementById('rMeet').innerHTML = nav
    ? (f.state === 'waiting' ? `✅ <b>${f.name}</b> is waiting for you at the <b>${where}</b>.` : `📨 ${f.name} will stop and wait at the <b>${where}</b>.`)
    : `Meeting point: <b>${where}</b> — the next spot ${f.name} reaches. ${youT > fT + 30 ? `They'll get there ~${fmtT(youT - fT)} before you, so we'll ask them to wait.` : `You'll get there first.`}`;
}
function routeSig(){
  const r = ui.route, nav = ui.nav;
  const edges = nav ? (you.edge ? [you.edge] : []).concat(you.navQueue) : r && !r.error ? r.edges : [];
  const opts = r && r.options ? r.options.map(o => o.sig + ':' + o.caps.join('')).join('/') : '';
  return edges.map(e => e.idx).join() + '|' + (r && r.meet) + '|' + !!nav + '|' + opts + '|' + (r && r.error) + '|' + (you.edge && you.edge.idx);
}
function pickOption(key){
  if (ui.nav) return;

}
